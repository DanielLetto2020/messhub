<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>messhub — поиск</title>
<style>
  /* окно результатов поиска из шапки доски: выпадает над панелью, фокус не забирает (ввод — в шапке) */
  :root {
    --glass: 18,21,28; --line: rgba(255,255,255,.1); --text: #eef1f6; --muted: #98a1b2; --faint: #6d7586;
    --card-hover: rgba(255,255,255,.07); --accent: #6aa2ff; --accent-bg: rgba(106,162,255,.16);
    --ok: #43d69a; --warn: #f2b25a; --mark: rgba(242,178,90,.34);
  }
  body.light { --glass: 246,247,250; --line: rgba(0,0,0,.1); --text: #1b1f27; --muted: #5d6574; --faint: #8a91a0;
    --card-hover: rgba(0,0,0,.05); --accent: #2f6fe0; --accent-bg: rgba(47,111,224,.12); --ok: #16935f; --warn: #b9771f;
    --mark: rgba(242,178,90,.5); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden;
    font: 12.5px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); }
  .box { height: 100%; display: flex; flex-direction: column; background: rgba(var(--glass), .97); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 10px 34px rgba(0,0,0,.45); overflow: hidden; }
  .pyw .box, html.pyw body { border-radius: 0; box-shadow: none; }
  html.pyw, html.pyw body { background: rgb(var(--glass)); }
  .hd { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); flex: 0 0 auto; color: var(--muted); font-size: 11.5px; }
  .hd b { color: var(--text); font-weight: 600; }
  .hd .sp { flex: 1; }
  .hd a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .hd a:hover { text-decoration: underline; }
  .hd .x { cursor: pointer; border: 0; background: none; color: var(--muted); width: 22px; height: 22px; border-radius: 6px; }
  .hd .x:hover { color: var(--text); background: var(--card-hover); }
  #list { flex: 1; overflow-y: auto; padding: 4px; }
  .r { padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .r:hover, .r.sel { background: var(--card-hover); }
  .r.sel { outline: 1px solid var(--accent); outline-offset: -1px; }
  .r .h { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .r .ico { flex: 0 0 auto; }
  .r .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r .who b { font-weight: 600; }
  .r .who span { color: var(--accent); }
  .r .w { flex: 0 0 auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .r .st { flex: 0 0 auto; font-size: 10px; border-radius: 999px; padding: 0 6px; color: var(--muted); border: 1px solid var(--line); }
  .r .st.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .r .x { color: var(--muted); margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
  .r mark { background: var(--mark); color: var(--text); border-radius: 3px; padding: 0 1px; }
  .empty { color: var(--muted); text-align: center; padding: 28px 10px; }
  .wrap-privacy #list { filter: blur(9px); }
  ::-webkit-scrollbar { width: 7px; }
  ::-webkit-scrollbar-thumb { background: rgba(128,128,128,.3); border-radius: 6px; }
</style>
<script src="/i18n.js"></script>
</head>
<body>
<div class="box" id="box">
  <div class="hd"><span id="info"></span><span class="sp"></span><a id="more"></a><button class="x" id="closeBtn" type="button">✕</button></div>
  <div id="list"><div class="empty" data-t="Загружаю…">Загружаю…</div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const QS = new URLSearchParams(location.search);
const PYW = QS.get('host') === 'pywebview', pywQueue = [];
const host = (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.widget) ||
  (PYW ? {postMessage: m => { if (window.pywebview && window.pywebview.api) window.pywebview.api.post(m); else pywQueue.push(m); }} : null);
if (PYW) { document.documentElement.classList.add('pyw'); window.addEventListener('pywebviewready', () => { while (pywQueue.length) window.pywebview.api.post(pywQueue.shift()); }); }
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
let rows=[], sel=-1, query='', seq=0;
// кусок текста вокруг первого совпадения, совпадения подсвечены
function snippet(text, q){
  const t0=(text||'').replace(/\s+/g,' '), i=q?t0.toLowerCase().indexOf(q.toLowerCase()):-1;
  const from=i>60?i-50:0, part=(from?'…':'')+t0.slice(from,from+220);
  if(!q) return esc(part);
  return esc(part).replace(new RegExp(escRe(esc(q)),'gi'),m=>`<mark>${m}</mark>`);
}
function when(iso){if(!iso)return'';const x=iso.replace('T',' '),d=new Date(x.replace(' ','T')),now=new Date();
  return d.toDateString()===now.toDateString()?x.slice(11,16):x.slice(8,10)+'.'+x.slice(5,7)+' '+x.slice(11,16);}
function draw(total){
  $('info').innerHTML=query?(rows.length?`${esc(t('Найдено'))}: <b>${total}</b>`:''):'';
  $('more').textContent=query?t('Все результаты в «Поиске»'):'';
  $('list').innerHTML=!query?'':rows.length?rows.map((r,i)=>`<div class="r${i===sel?' sel':''}" data-i="${i}">
      <div class="h"><span class="ico">${esc(r.src_ico||'🔔')}</span><span class="who"><b>${esc(r.chat||r.src_name)}</b>${r.sender&&r.sender!==r.chat?` · <span>${esc(r.sender)}</span>`:''}</span>
        <span class="st${!r.is_read&&r.visible?' on':''}">${esc(t(r.is_read?'прочитано':r.visible?'на доске':'скрыто'))}</span><span class="w">${esc(when(r.event_iso))}</span></div>
      <div class="x">${snippet(r.message,query)}</div></div>`).join('')
    :`<div class="empty">${esc(t('Ничего не нашлось по «{q}»',{q:query}))}</div>`;
  $('list').querySelectorAll('.r').forEach(el=>el.onclick=()=>openRow(+el.dataset.i));
  const s=$('list').querySelector('.r.sel'); if(s) s.scrollIntoView({block:'nearest'});
}
function openRow(i){
  const r=rows[i]; if(!r) return;
  if(host){host.postMessage('message:'+r.id);host.postMessage('search-close');}
  else window.open('/message?id='+r.id,'messhub-message','width=900,height=640');
}
async function search(q){
  query=(q||'').trim(); sel=-1;
  const my=++seq;
  if(!query){rows=[];draw(0);return;}
  try{
    const d=await(await fetch('/api/search?limit=40&q='+encodeURIComponent(query))).json();
    if(my!==seq) return;               // пока ждали ответ, ввели другое
    rows=d.rows||[]; draw(d.total||0);
  }catch(e){$('list').innerHTML=`<div class="empty">${esc(t('Сервер виджета не отвечает'))}</div>`;}
}
// окно доски: ввод в шапке → hostSearch(q), стрелки и Enter → hostNav
window.hostSearch=q=>search(q);
window.hostNav=k=>{
  if(!rows.length) return;
  if(k==='down') sel=Math.min(rows.length-1,sel+1);
  else if(k==='up') sel=Math.max(0,sel-1);
  else if(k==='enter'){openRow(sel<0?0:sel);return;}
  draw(rows.length);
};
window.hostPrivacy=v=>document.body.classList.toggle('wrap-privacy',!!v);
$('closeBtn').onclick=()=>{if(host)host.postMessage('search-close');else window.close();};
$('more').onclick=()=>{try{localStorage.setItem('messhub.searchq',query);}catch(e){}
  if(host){host.postMessage('settings:search');host.postMessage('search-close');}else window.open('/settings#search','_blank');};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(host)host.postMessage('search-close');else window.close();}});
(async()=>{
  try{const p=await(await fetch('/api/prefs')).json();setLang(p._lang);translateDom();document.body.classList.toggle('light',p.theme==='light');}catch(e){}
  try{if(localStorage.getItem('privacy')==='1')document.body.classList.add('wrap-privacy');}catch(e){}
  search(QS.get('q')||'');
})();
</script>
</body>
</html>

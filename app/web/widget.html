<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>messhub</title>
<style>
  :root {
    --glass: 18,21,28; --op: .72; --fs: 13px;
    --line: rgba(255,255,255,.09); --text: #eef1f6; --muted: #98a1b2;
    --card: rgba(255,255,255,.04); --card-hover: rgba(255,255,255,.07); --col: rgba(255,255,255,.03);
    --accent: #6aa2ff; --accent-bg: rgba(106,162,255,.15); --bot: #c08cff; --media: #f2b25a;
    --ok: #43d69a; --ok-bg: rgba(67,214,154,.14); --warn: #f2b25a; --bad: #ff7a7a;
    --new: rgba(90,150,255,.22); --mark: rgba(242,178,90,.32);
  }
  body.light {
    --glass: 246,247,250;
    --line: rgba(0,0,0,.1); --text: #1b1f27; --muted: #5d6574;
    --card: rgba(0,0,0,.035); --card-hover: rgba(0,0,0,.06); --col: rgba(0,0,0,.025);
    --accent: #2f6fe0; --accent-bg: rgba(47,111,224,.12); --bot: #8a4fd6; --media: #b9771f;
    --ok: #16935f; --ok-bg: rgba(22,147,95,.12); --warn: #b9771f; --bad: #d64545;
    --new: rgba(47,111,224,.16); --mark: rgba(242,178,90,.45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden;
    font: var(--fs)/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); }
  /* полупрозрачная «стеклянная» подложка виджета; прозрачность — из настроек */
  .wrap {
    height: 100%; margin: 0; border-radius: 16px; position: relative;
    background: rgba(var(--glass), var(--op));
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--line); box-shadow: 0 10px 40px rgba(0,0,0,.45);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .bar {
    display: flex; align-items: center; gap: 6px; padding: 7px 12px;
    border-bottom: 1px solid var(--line); flex: 0 0 auto;
    cursor: move; user-select: none;   /* за шапку окно перетаскивается */
  }
  .bar .title { font-weight: 600; font-size: 12px; letter-spacing: .3px; opacity: .9; }
  .bar .ver { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  /* версия: ✓ — стоит последняя; «↑ 1.0.N» — есть новее (ссылка на страницу выпуска) */
  .bar .vok { color: var(--ok); font-size: 10px; margin-left: 3px; opacity: .8; }
  .bar .upd { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; padding: 1px 7px 1px 5px;
    border-radius: 999px; font-size: 10.5px; font-weight: 600; color: var(--accent); background: var(--accent-bg);
    text-decoration: none; font-variant-numeric: tabular-nums; }
  .bar .upd:hover { filter: brightness(1.15); }
  .bar a.ib { color: inherit; text-decoration: none; }
  .bar .upd[hidden], .bar .vok[hidden] { display: none; }     /* иначе display выше перебивает hidden */
  .bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .bar .dot.on { animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(67,214,154,.6)} 70%{box-shadow:0 0 0 6px rgba(67,214,154,0)} 100%{box-shadow:0 0 0 0} }
  .bar .count { margin-left: auto; margin-right: 6px; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .bar .ib { cursor: pointer; opacity: .7; display: inline-flex; align-items: center; gap: 4px;
    padding: 3px; border-radius: 7px; color: var(--text); }
  .bar .ib:hover { opacity: 1; background: var(--card-hover); }
  .bar .ib.active { opacity: 1; color: var(--accent); background: var(--accent-bg); }
  .bar .ib.confirm { opacity: 1; color: var(--warn); background: rgba(242,178,90,.15); padding-right: 7px; }
  .bar .ib.confirm::after { content: attr(data-again); font-size: 10.5px; margin-left: 4px; }
  .bar .prof { font-size: 11px; padding: 3px 7px 3px 5px; }
  .bar .prof[hidden] { display: none; }
  /* режим приватности: размываем всё содержимое доски */
  .wrap.privacy #board { filter: blur(11px); }
  .wrap.privacy #board * { text-shadow: 0 0 12px rgba(0,0,0,.4); }

  #board { display: flex; gap: 10px; align-items: stretch; flex: 1 1 auto;
    overflow-x: auto; overflow-y: hidden; padding: 10px 12px; min-height: 0; }
  .col { flex: 1 1 0; min-width: 220px; display: flex; flex-direction: column; min-height: 0;
    background: var(--col); border: 1px solid var(--line); border-radius: 12px; }
  .col.dragging { opacity: .45; }
  .col.drop-before { box-shadow: -3px 0 0 var(--accent); }
  .col.drop-after { box-shadow: 3px 0 0 var(--accent); }
  .col-head { display: flex; align-items: center; gap: 7px; padding: 8px 8px 8px 10px;
    border-bottom: 1px solid var(--line); flex: 0 0 auto; cursor: grab; }
  .col-head .ico { font-size: 15px; }
  .col-head .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col-head .c { margin-left: auto; color: var(--muted); font-size: 11px;
    background: var(--card-hover); border-radius: 999px; padding: 0 7px; }
  .col-head .closeb { opacity: 0; }
  .col-head:hover .closeb { opacity: .6; }
  .col-head .closeb:hover { opacity: 1; color: var(--bad); }
  .col-body { overflow-y: auto; padding: 7px; min-height: 0; }
  /* всё в колонке прочитано — колонка остаётся и ждёт новых */
  .col-body:empty::before { content: attr(data-empty); display: block; text-align: center;
    color: var(--muted); font-size: 11px; padding: 18px 0; opacity: .7; }

  /* кнопки-действия на плашках */
  .ab { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%; color: var(--muted); cursor: pointer; opacity: .6; }
  .ab:hover { opacity: 1; color: var(--text); background: var(--card-hover); }
  .ab.read:hover { color: var(--ok); background: var(--ok-bg); }
  .ab.on { opacity: 1; color: var(--accent); }
  .col-head .ab { width: 22px; height: 22px; }

  .msg { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 9px;
    padding: 7px 9px; margin: 0 0 7px; }
  .msg.flash, .grp.flash { animation: flash 1.3s ease; }
  .msg.gone, .grp.gone { height: 0 !important; padding-top: 0; padding-bottom: 0; margin: 0;
    border-width: 0; opacity: 0; overflow: hidden;
    transition: height .2s ease, padding .2s ease, margin .2s ease, opacity .15s ease; }
  @keyframes flash { 0%{background:var(--new)} 100%{background:var(--card)} }
  .top { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; position: relative; }
  /* имя чата/отправителя обрезается, а время и кнопки всегда в той же строке */
  .who { flex: 1 1 auto; min-width: 48px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .badge { margin-right: 4px; vertical-align: 1px; }
  .msg .who:not(.nogo) { cursor: pointer; }
  .msg .who:not(.nogo):hover .chat, .msg .who:not(.nogo):hover .sender { text-decoration: underline; text-underline-offset: 2px; }
  .av { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; vertical-align: -4px; margin-right: 5px; }
  .chat { font-weight: 600; }
  .sender { color: var(--accent); }
  .badge { font-size: 9px; padding: 0 5px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
    display: inline-flex; align-items: center; }
  .badge.bot { color: var(--bot); border-color: var(--bot); }
  .badge.media { color: var(--media); }
  .badge.urg { color: var(--bad); border-color: var(--bad); }
  .badge.at { color: var(--warn); border-color: var(--warn); font-weight: 700; }
  .badge.pin { color: var(--accent); border: 0; padding: 0; }
  .time { flex: 0 0 auto; color: var(--muted); font-size: 10px; white-space: nowrap; }
  /* «перейти», «почему», «отложить», «закрепить» — по наведению, поверх времени */
  .acts { position: absolute; right: 22px; top: -2px; display: inline-flex; gap: 1px; padding: 0 2px;
    border-radius: 999px; background: rgba(var(--glass), .96); opacity: 0; pointer-events: none;
    transition: opacity .12s; }
  .msg:hover > .top .acts { opacity: 1; pointer-events: auto; }
  .body { white-space: pre-wrap; word-break: break-word; opacity: .95; cursor: text; }
  .body mark, .gprev mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  a.lnk { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .msg.pinned { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  /* тематические колонки: проблема ушла — карточка бледнеет, внизу «✓ починилось» */
  .msg.resolved > .top, .msg.resolved > .body { opacity: .55; }
  .fixed { margin-top: 4px; font-size: 10.5px; font-weight: 600; color: var(--ok); }
  /* хвост лога — свёрнут, по клику раскрывается; двойной клик — скопировать лог */
  .det { margin-top: 4px; }
  .det .dt { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; color: var(--muted); cursor: pointer;
    border-radius: 6px; padding: 0 5px 0 2px; user-select: none; }
  .det .dt:hover { color: var(--text); background: var(--card-hover); }
  .det .dt svg { transition: transform .15s; }
  .det.open .dt svg { transform: rotate(90deg); }
  .det pre { margin: 4px 0 0; max-height: 170px; overflow: auto; padding: 6px 8px; border-radius: 7px;
    background: rgba(0,0,0,.28); font: 10.5px/1.45 ui-monospace, "DejaVu Sans Mono", Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; cursor: text; }
  body.light .det pre { background: rgba(0,0,0,.06); }
  .msg.copied::after, .msg.copyfail::after { position: absolute; right: 8px; bottom: 6px; font-size: 10px;
    padding: 1px 7px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); content: attr(data-note); }
  .msg.copyfail::after { color: var(--bad); background: rgba(255,122,122,.14); }

  /* подсветка правилом: полоска слева + лёгкий фон своего цвета */
  .hl-red { --hl: #ff6b6b; } .hl-orange { --hl: #f59f45; } .hl-yellow { --hl: #e2c23b; }
  .hl-green { --hl: #3ec98f; } .hl-blue { --hl: #5b9bff; } .hl-purple { --hl: #b884ff; }
  .msg.hl, .grp.hl { border-left: 3px solid var(--hl);
    background: color-mix(in srgb, var(--hl) 11%, var(--card)); }

  /* свёрнутый чат: «Флуд 5», по клику раскрывается */
  .grp { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 9px; margin: 0 0 7px; }
  .gtop { display: flex; align-items: center; gap: 6px; padding: 7px 9px 2px; cursor: pointer; }
  .gtop .gn { flex: 0 0 auto; white-space: nowrap; font-size: 10.5px; color: var(--accent); background: var(--accent-bg);
    border-radius: 999px; padding: 0 7px; }
  .gtop .tw { color: var(--muted); display: inline-flex; transition: transform .15s; }
  .grp.open .gtop .tw { transform: rotate(90deg); }
  .gprev { padding: 0 9px 7px 25px; opacity: .85; overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; cursor: pointer; }
  .gbody { padding: 4px 6px 0 16px; }
  .gbody .msg { background: transparent; }

  /* всплывающие меню: «отложить», профиль, «почему» */
  .menu { position: fixed; z-index: 30; min-width: 190px; max-width: 340px; padding: 4px; border-radius: 10px;
    background: rgba(var(--glass), .97); border: 1px solid var(--line); box-shadow: 0 8px 28px rgba(0,0,0,.45); }
  .menu[hidden] { display: none; }
  .menu .h { font-size: 11px; color: var(--muted); padding: 4px 8px 3px; }
  .menu .p { padding: 3px 8px 5px; line-height: 1.45; }
  .menu button { display: flex; width: 100%; gap: 8px; background: none; border: 0; color: var(--text);
    font: inherit; padding: 6px 8px; border-radius: 7px; cursor: pointer; text-align: left; }
  .menu button:hover { background: var(--card-hover); }
  .menu button.cur { color: var(--accent); }
  .menu button span + span { margin-left: auto; color: var(--muted); }
  .menu button.go { color: var(--accent); font-weight: 600; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

  #empty { color: var(--muted); text-align: center; padding: 30px 0; width: 100%; font-size: 12px; }
  #toast { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 25;
    display: flex; align-items: center; gap: 10px;
    background: rgba(var(--glass), .97); border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 6px 4px 12px; font-size: 11.5px; opacity: 0; pointer-events: none; transition: opacity .15s; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #toast.show.act { pointer-events: auto; }
  #toast.err { color: var(--bad); }
  #toast .tb { background: var(--accent-bg); color: var(--accent); border: 0; border-radius: 999px; font: inherit;
    font-weight: 600; padding: 2px 10px; cursor: pointer; }
  #toast .tb[hidden] { display: none; }
  #toast:not(.act) { padding-right: 12px; }

  /* компактный режим из настроек */
  .compact .msg { padding: 4px 7px; margin-bottom: 4px; border-radius: 7px; }
  .compact .grp { margin-bottom: 4px; }
  .compact .gtop { padding: 4px 7px 1px; }
  .compact .gprev { padding-bottom: 4px; -webkit-line-clamp: 1; }
  .compact .col-body { padding: 5px; }
  .compact #board { gap: 7px; padding: 7px 9px; }

  /* ручки размера: окно без рамки, поэтому края/углы ловит страница (см. widget.py) */
  .rz { position: fixed; z-index: 20; }
  .rz.n  { top: 0;    left: 14px; right: 14px; height: 6px; cursor: n-resize; }
  .rz.s  { bottom: 0; left: 14px; right: 14px; height: 6px; cursor: s-resize; }
  .rz.e  { right: 0;  top: 14px; bottom: 14px; width: 6px;  cursor: e-resize; }
  .rz.w  { left: 0;   top: 14px; bottom: 14px; width: 6px;  cursor: w-resize; }
  .rz.ne { top: 0;    right: 0; width: 14px; height: 14px; cursor: ne-resize; }
  .rz.nw { top: 0;    left: 0;  width: 14px; height: 14px; cursor: nw-resize; }
  .rz.se { bottom: 0; right: 0; width: 14px; height: 14px; cursor: se-resize; }
  .rz.sw { bottom: 0; left: 0;  width: 14px; height: 14px; cursor: sw-resize; }
  /* страница открыта в обычном браузере, а не в окне виджета — двигать нечего */
  .nohost .rz, .nohost .lock { display: none; }
  /* окно Windows (winwidget.py): прозрачных окон там нет — подложка сплошная, без скруглений */
  html.pyw, html.pyw body { background: rgb(var(--glass)); }
  .pyw .wrap { background: rgb(var(--glass)); border-radius: 0; border: 0; box-shadow: none;
    -webkit-backdrop-filter: none; backdrop-filter: none; }
  .nohost .bar { cursor: default; }
  /* закреплено замком: ни перетащить, ни растянуть */
  .locked .rz { display: none; }
  .locked .bar { cursor: default; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-thumb { background: rgba(128,128,128,.3); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
</style>
<script src="/i18n.js"></script>
</head>

    <span class="title" id="appName">messhub</span><span class="ver" id="ver"></span><span class="vok" id="vok" hidden>✓</span>
    <a class="upd" id="upd" hidden target="_blank" rel="noopener noreferrer"></a>

    </span>

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>

    </span>

      <svg id="lockShut" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>

    <span class="ib gear" id="gear" data-t-title="Настройки">

    </span>
  </div>
  <div id="board"><div id="empty" data-t="Ожидание сообщений…">Ожидание сообщений…</div></div>

</div>

<script>
// ошибки страницы — в журнал программы (настройки → «Логи»), не чаще 10 в минуту
(()=>{let n=0,t0=Date.now();const send=(msg,where)=>{if(Date.now()-t0>6e4){n=0;t0=Date.now();}if(++n>10)return;
  try{fetch('/api/logs/client',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'widget',msg:String(msg).slice(0,1000),where})}).catch(()=>{});}catch(e){}};
  window.addEventListener('error',e=>send(e.message,(e.filename||'').split('/').pop()+':'+e.lineno));
  window.addEventListener('unhandledrejection',e=>send('Promise: '+((e.reason&&e.reason.message)||e.reason),''));})();
const $ = id => document.getElementById(id);
const board = $('board'), empty = $('empty'), dot = $('dot'), countEl = $('count'), menu = $('menu');
const QS = new URLSearchParams(location.search);
// окно-хозяин: GTK+WebKit (widget.py, Linux) или pywebview (winwidget.py, Windows, адрес с ?host=pywebview).
// У pywebview мост window.pywebview.api появляется позже (событие pywebviewready) — до него копим
const PYW = QS.get('host') === 'pywebview';
const pywQueue = [];
const host = (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.widget) ||
  (PYW ? {postMessage: m => { if (window.pywebview && window.pywebview.api) window.pywebview.api.post(m); else pywQueue.push(m); }} : null);
if (PYW) {
  document.documentElement.classList.add('pyw'); document.body.classList.add('pyw');
  window.addEventListener('pywebviewready', () => { while (pywQueue.length) window.pywebview.api.post(pywQueue.shift()); });
}
if (!host) document.body.classList.add('nohost');
// второй виджет с отбором: widget.py --only express,telegram → /widget?only=express,telegram
const ONLY = (QS.get('only') || '').split(',').map(s => s.trim()).filter(Boolean);

const ICON = {
  check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  check2: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 6 7 16 2 11"/><polyline points="22 8 14 16 12.5 14.5"/></svg>',
  pin: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>',
  pinS: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>',
  go: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
  why: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
  clock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  chev: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  close: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
};

// ── состояние ──
let prefs = {group_by_chat: true, mentions: [], col_order: [], hidden_cols: [], profiles: [], avatars: true}, mentionRe = null;
let rulesVer = null, prefsVer = null, lastId = 0, loading = false, appVer = null;
const msgs = new Map();     // id → сообщение с сервера (src, highlight, mention, pinned, avatar, …)
const cols = new Map();     // ключ источника → {meta, col, body, cEl}
const open = new Set();     // раскрытые группы: ключ источника + \u0001 + чат
const fresh = new Set();    // только что пришедшие — мигнуть при отрисовке
const gids = new Map(), gkeys = new Map();   // группа ↔ короткий номер для data-атрибута
const skipped = new Set();  // пришли, но их колонка скрыта или вне ?only= — сверка их не возвращает
const openDet = new Set();  // карточки с раскрытым хвостом лога
let focus = false; try { focus = localStorage.getItem('focus') === '1'; } catch (e) {}

function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
const attr = s => esc(s).replace(/"/g,'&quot;');
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function fmtTime(iso){if(!iso)return'';const x=iso.replace('T',' ');return x.length>=19?x.slice(11,16):x;}
function gid(g){if(!gids.has(g)){const i=gids.size+1;gids.set(g,i);gkeys.set(i,g);}return gids.get(g);}
const important = m => !!(m.pinned || m.highlight || m.mention);
let toastT = 0, toastAct = null;
// подсказка внизу; opts.action — кнопка («Вернуть») на 5 секунд
function toast(text, opts){
  opts = opts || {};
  const el=$('toast'), b=el.querySelector('.tb');
  el.querySelector('.tt').textContent=text;
  toastAct=opts.action||null;
  b.hidden=!toastAct; if(toastAct) b.textContent=toastAct.label;
  el.className='show'+(opts.err?' err':'')+(toastAct?' act':'');
  clearTimeout(toastT); toastT=setTimeout(()=>{el.className='';toastAct=null;},toastAct?5000:2200);
}
$('toast').querySelector('.tb').addEventListener('click',()=>{const a=toastAct;$('toast').className='';toastAct=null;if(a)a.run();});
function setOnline(ok){dot.style.background=ok?'var(--ok)':'var(--bad)';dot.classList.toggle('on',ok);}
async function post(path, body){
  const r = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

// ── текст: упоминания подсвечиваем, ссылки делаем кликабельными ──
function buildMentionRe(list){
  const n=[...new Set((list||[]).map(s=>s.trim()).filter(Boolean))].sort((a,b)=>b.length-a.length);
  if(!n.length) return null;
  // с начала слова: «Иван» найдёт и «Ивану» (так же считает сервер — rules.mention_re)
  return new RegExp('(?<![\\p{L}\\p{N}_])(?:'+n.map(escRe).join('|')+')','giu');
}
function marks(s){
  if(!mentionRe) return esc(s);
  let out='', last=0, m; mentionRe.lastIndex=0;
  while((m=mentionRe.exec(s))){
    if(!m[0]){mentionRe.lastIndex++;continue;}
    out+=esc(s.slice(last,m.index))+'<mark>'+esc(m[0])+'</mark>'; last=m.index+m[0].length;
  }
  return out+esc(s.slice(last));
}
const URL_RE = /https?:\/\/[^\s<>"'«»]+[^\s<>"'«».,;:!?)\]]/g;
function rich(s){
  let out='', last=0, m; URL_RE.lastIndex=0;
  while((m=URL_RE.exec(s))){
    out+=marks(s.slice(last,m.index))+`<a class="lnk" href="${attr(m[0])}" target="_blank" rel="noopener noreferrer">${esc(m[0])}</a>`;
    last=m.index+m[0].length;
  }
  return out+marks(s.slice(last));
}
const avatar = m => prefs.avatars && m.avatar ? `<img class="av" src="/avatar/${attr(m.avatar)}" alt="">` : '';

// ── колонки: порядок — из prefs.col_order (перетаскивание), дальше — по умолчанию ──
function metaOf(m){return {key:m.src,name:m.src_name,ico:m.src_ico,rank:m.src_rank};}
const colAllowed = key => !(prefs.hidden_cols||[]).includes(key) && (!ONLY.length || ONLY.includes(key));
function colSort(meta){
  const i=(prefs.col_order||[]).indexOf(meta.key);
  return i>=0?[0,i,'']:[1,meta.rank,meta.name];
}
function before(a,b){for(let i=0;i<3;i++){if(a[i]<b[i])return true;if(a[i]>b[i])return false;}return false;}
function ensureCol(meta){
  if(cols.has(meta.key)) return cols.get(meta.key);
  if(!colAllowed(meta.key)) return null;
  const col=document.createElement('div');col.className='col';col.dataset.key=meta.key;
  col.innerHTML=`<div class="col-head" draggable="true" title="${attr(t('Перетащи, чтобы поменять порядок колонок'))}">
    <span class="ico">${esc(meta.ico)}</span><span class="nm">${esc(meta.name)}</span>
    <span class="c">0</span><span class="ab read" data-act="read-col" title="${attr(t('Прочитать всё в колонке, кроме закреплённого'))}">${ICON.check2}</span>
    <span class="ab closeb" data-act="close-col" title="${attr(t('Закрыть колонку'))}">${ICON.close}</span></div>
    <div class="col-body" data-empty="${attr(t(focus?'важного нет':'нет новых'))}"></div>`;
  const key=colSort(meta);
  const pos=[...cols.values()].map(c=>c.col).find(c=>before(key,colSort(cols.get(c.dataset.key).meta)));
  board.insertBefore(col,pos||null);
  const c={meta,col,body:col.querySelector('.col-body'),cEl:col.querySelector('.c')};
  cols.set(meta.key,c);
  bindDrag(col);
  return c;
}
function colItems(key){
  return [...msgs.values()].filter(m=>m.src===key&&(!focus||important(m))).sort((a,b)=>b.id-a.id);
}
function cardHtml(m, withChat){
  let b='';
  if(m.pinned) b+=`<span class="badge pin" title="${attr(t('Закреплено'))}">${ICON.pinS}</span>`;
  if(m.mention) b+=`<span class="badge at" title="${attr(t('Упоминание'))}">@</span>`;
  if(m.is_bot) b+=`<span class="badge bot">${esc(t('бот'))}</span>`;
  if(m.has_media) b+='<span class="badge media">📎</span>';
  if(m.urgency>=2) b+='<span class="badge urg">!</span>';
  const who = withChat
    ? `<span class="chat">${esc(m.chat)}</span>`+(m.sender&&m.sender!==m.chat?` · <span class="sender">${esc(m.sender)}</span>`:'')
    : `<span class="sender">${esc(m.sender||m.chat)}</span>`;
  const cls='msg'+(fresh.has(m.id)?' flash':'')+(m.highlight?' hl hl-'+m.highlight:'')+(m.pinned?' pinned':'')+(m.resolved_at?' resolved':'');
  const nLines=m.details?m.details.split('\n').length:0, dOpen=openDet.has(m.id);
  const det=m.details?`<div class="det${dOpen?' open':''}"><span class="dt" data-act="det">${ICON.chev}${esc(t('Лог'))} · ${esc(tp(nLines,...W.line))}</span>${
    dOpen?`<pre class="log" title="${attr(t('Двойной клик — скопировать лог'))}">${esc(m.details)}</pre>`:''}</div>`:'';
  const fixed=m.resolved_at?`<div class="fixed">${esc(t('✓ Починилось в {hm}',{hm:m.resolved_at.slice(11,16)}))}</div>`:'';
  // письма из ящиков (mail.py) приходят не из окна приложения — переходить некуда
  const go=m.app==='mail-imap'?'':m.site?t('Открыть {site}',{site:m.site}):t('Перейти в {app}',{app:m.src_name});
  const goAttr=go?` data-act="open" title="${attr(go)}"`:'';
  return `<div class="${cls}" data-id="${m.id}"><div class="top"><span class="who${go?'':' nogo'}"${goAttr}>${avatar(m)}${b}${who}</span><span class="time">${esc(fmtTime(m.event_iso))}</span>
    <span class="acts">${go?`<span class="ab" data-act="open" title="${attr(go)}">${ICON.go}</span>`:''}<span class="ab" data-act="why" title="${attr(t('Почему так?'))}">${ICON.why}</span>
    <span class="ab" data-act="snooze" title="${attr(t('Отложить'))}">${ICON.clock}</span>
    <span class="ab${m.pinned?' on':''}" data-act="pin" title="${attr(m.pinned?t('Открепить'):t('Закрепить — не прочитается само через 24 ч'))}">${ICON.pin}</span></span>
    <span class="ab read" data-act="read" title="${attr(t('Прочитано — скрыть'))}">${ICON.check}</span></div>
    <div class="body" title="${attr(t('Двойной клик — скопировать текст'))}">${rich(m.message||'')}</div>${det}${fixed}</div>`;
}
function groupHtml(key, chat, list){
  const g=key+'\u0001'+chat, isOpen=open.has(g), last=list[0];
  const color=(list.find(m=>m.highlight)||{}).highlight, men=list.some(m=>m.mention);
  const flash=list.some(m=>fresh.has(m.id));
  const prev=(last.sender&&last.sender!==chat?`<span class="sender">${esc(last.sender)}:</span> `:'')+marks(last.message||'');
  return `<div class="grp${isOpen?' open':''}${flash?' flash':''}${color?' hl hl-'+color:''}" data-g="${gid(g)}">
    <div class="gtop" data-act="toggle"><span class="tw">${ICON.chev}</span>
      <span class="who">${avatar(last)}${men?`<span class="badge at" title="${attr(t('Есть упоминание'))}">@</span>`:''}<span class="chat">${esc(chat||'—')}</span></span>
      <span class="gn" title="${attr(tp(list.length,...W.newMsg))}">${list.length}</span>
      <span class="time">${esc(fmtTime(last.event_iso))}</span>
      <span class="ab read" data-act="read-group" title="${attr(t('Прочитать весь чат'))}">${ICON.check2}</span></div>
    ${isOpen?`<div class="gbody">${list.map(m=>cardHtml(m,false)).join('')}</div>`
            :`<div class="gprev" data-act="toggle">${prev}</div>`}</div>`;
}
function renderCol(key){
  const c=cols.get(key); if(!c) return;
  const items=colItems(key), pinned=items.filter(m=>m.pinned), rest=items.filter(m=>!m.pinned);
  let html=pinned.map(m=>cardHtml(m,true)).join('');
  if(prefs.group_by_chat){
    // одна плашка на чат, если из него несколько сообщений; порядок — по самому свежему
    const groups=new Map();
    for(const m of rest){const k=m.chat||'';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(m);}
    for(const [chat,list] of groups) html+=list.length>1?groupHtml(key,chat,list):cardHtml(list[0],true);
  } else html+=rest.map(m=>cardHtml(m,true)).join('');
  const st=c.body.scrollTop; c.body.innerHTML=html; c.body.scrollTop=st;
  c.body.dataset.empty=t(focus?'важного нет':'нет новых');
  c.cEl.textContent=items.length;
}
function renderAll(){for(const k of cols.keys())renderCol(k);fresh.clear();updateCount();}
function renderKeys(keys){keys.forEach(renderCol);fresh.clear();updateCount();}
function updateCount(){
  const n=cols.size, shown=[...msgs.values()].filter(m=>cols.has(m.src)&&(!focus||important(m))).length;
  empty.style.display=n?'none':'block';
  let s=shown+' · '+t('{n} ист.',{n});
  if(focus) s=t('фокус')+' · '+s;
  if(ONLY.length) s=t('только: {names}',{names:[...cols.values()].map(c=>c.meta.name).join(', ')||ONLY.join(', ')})+' · '+shown;
  countEl.textContent=s;
  $('focusBtn').classList.toggle('active',focus);
}

// ── перетаскивание колонок (порядок сохраняется в prefs.col_order) ──
let dragKey=null;
function bindDrag(col){
  const head=col.querySelector('.col-head');
  head.addEventListener('dragstart',e=>{dragKey=col.dataset.key;col.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragKey);});
  head.addEventListener('dragend',()=>{col.classList.remove('dragging');dragKey=null;
    board.querySelectorAll('.drop-before,.drop-after').forEach(c=>c.classList.remove('drop-before','drop-after'));});
  col.addEventListener('dragover',e=>{if(!dragKey||dragKey===col.dataset.key)return;e.preventDefault();
    const r=col.getBoundingClientRect(),after=e.clientX>r.left+r.width/2;
    col.classList.toggle('drop-after',after);col.classList.toggle('drop-before',!after);});
  col.addEventListener('dragleave',()=>col.classList.remove('drop-before','drop-after'));
  col.addEventListener('drop',async e=>{
    e.preventDefault();const after=col.classList.contains('drop-after');
    col.classList.remove('drop-before','drop-after');
    const moving=cols.get(dragKey);if(!moving||dragKey===col.dataset.key)return;
    board.insertBefore(moving.col,after?col.nextSibling:col);
    await savePrefs({col_order:[...board.querySelectorAll('.col')].map(c=>c.dataset.key)});
  });
}
// сохранить настройку из виджета, не перечитывая доску (версию настроек берём из ответа)
async function savePrefs(patch){
  try{const p=await post('/api/prefs',patch);prefs=p;prefsVer=p._ver;return p;}
  catch(e){toast(t('Не удалось обновить — сервер не отвечает'),{err:true});return null;}
}

// ── убрать с доски (прочитано, отложено, пропало при сверке) ──
function dropIds(ids){
  const keys=new Set();
  for(const id of ids){const m=msgs.get(id);if(!m)continue;keys.add(m.src);
    const el=board.querySelector(`.msg[data-id="${id}"]`);
    const g=el&&el.closest('.grp'); const target=g&&g.querySelectorAll('.msg').length<=1?g:el;
    if(target){target.style.height=target.offsetHeight+'px';target.offsetHeight;target.classList.add('gone');}}
  board.querySelectorAll('.grp:not(.open)').forEach(g=>{
    const [key,chat]=gkeys.get(+g.dataset.g).split('\u0001');
    if(!colItems(key).some(m=>!m.pinned&&(m.chat||'')===chat&&!ids.includes(m.id))){
      g.style.height=g.offsetHeight+'px';g.offsetHeight;g.classList.add('gone');}
  });
  setTimeout(()=>{ids.forEach(id=>msgs.delete(id));renderKeys(keys);},220);
}
async function fetchBack(ids){
  if(!ids.length) return;
  const rows=await(await fetch('/api/messages?rules=1&limit=1000&ids='+ids.join(','))).json();
  const keys=new Set();for(const m of rows){if(addMsg(m)){fresh.add(m.id);keys.add(m.src);}}renderKeys(keys);
}
// прочитать; в подсказке — «Вернуть» на 5 секунд (отмена на сервере: unread: true)
async function readIds(ids, label){
  if(!ids.length) return;
  try{await post('/api/read',{ids});}
  catch(e){toast(t('Не удалось отметить прочитанным — сервер не отвечает'),{err:true});setOnline(false);return;}
  dropIds(ids);
  toast(label||t('Прочитано'),{action:{label:t('Вернуть'),run:async()=>{
    try{await post('/api/read',{ids,unread:true});await fetchBack(ids);toast(t('Возвращено'));}
    catch(e){toast(t('Не удалось вернуть — сервер не отвечает'),{err:true});}}}});
}
const readable = key => colItems(key).filter(m=>!m.pinned).map(m=>m.id);

// ── действия на доске (один обработчик на всё) ──
board.addEventListener('click',e=>{
  if(e.target.closest('a.lnk')) return;          // ссылку открывает окно (widget.py) / браузер
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, card=a.closest('[data-id]'), grp=a.closest('[data-g]'), col=a.closest('.col');
  const id=card&&+card.dataset.id;
  if(act==='read') readIds([id]);
  else if(act==='pin') togglePin(id);
  else if(act==='snooze') openSnooze(a,id);
  else if(act==='open') openSource(msgs.get(id));
  else if(act==='why') openWhy(a,id);
  else if(act==='toggle'){const g=gkeys.get(+grp.dataset.g);open.has(g)?open.delete(g):open.add(g);renderCol(col.dataset.key);}
  else if(act==='read-group'){const [key,chat]=gkeys.get(+grp.dataset.g).split('\u0001');
    readIds(colItems(key).filter(m=>!m.pinned&&(m.chat||'')===chat).map(m=>m.id));}
  else if(act==='read-col'){const ids=readable(col.dataset.key);
    if(ids.length)readIds(ids,t('Прочитано: {n}',{n:ids.length}));}
  else if(act==='close-col') openClose(a,col.dataset.key);
  else if(act==='det'){openDet.has(id)?openDet.delete(id):openDet.add(id);renderCol(col.dataset.key);}
});
function dropCol(key){

function blockedHtml(st){

}

// «почему так?»: какое правило решило видимость, подсветку, что сработало при записи
function ruleDesc(r){
  if(!r) return '';
  const p=[];
  if(r.chat)p.push(t('в чате {x}',{x:'«'+r.chat+'»'}));
  if(r.sender)p.push(t('от {x}',{x:'«'+r.sender+'»'}));
  if(r.text)p.push(r.text_mode==='regex'?t('по выражению {x}',{x:'«'+r.text+'»'}):t('с текстом {x}',{x:'«'+r.text+'»'}));
  if(!p.length)p.push(r.src==='*'?t('все'):t('режим источника'));
  return p.join(' ');
}
const ACT_WORD={read:'Сразу прочитано',pin:'Закрепить',sound:'Звук',forward:'Переслать в Telegram'};
async function openWhy(btn,id){
  let w; try{w=await(await fetch('/api/why?id='+id)).json();}catch(e){return;}
  if(w.error) return;
  const lines=[];
  const vr=w.vis_rule;
  lines.push((w.visible?t('Видно в виджете'):t('Скрыто в виджете'))+' — '+
    (vr?(vr.src!=='*'&&!vr.chat&&!vr.sender&&!vr.text?t('режимом источника'):t('правилом: {r}',{r:ruleDesc(vr)})):t('по умолчанию'))+'.');
  if(w.highlight_rule) lines.push(t('Подсвечено правилом: {r}',{r:ruleDesc(w.highlight_rule)})+'.');
  for(const h of w.insert_hits) lines.push(t('При записи: {a} — правилом {r}',{a:t(ACT_WORD[h.action]||h.action),
    r:h.rule?ruleDesc(h.rule):t('правило уже удалено')})+'.');
  if(w.pinned&&!w.insert_hits.some(h=>h.action==='pin')) lines.push(t('Закреплено вручную или правилом')+'.');
  if(w.profile){const pr=(prefs.profiles||[]).find(p=>p.id===w.profile);if(pr)lines.push(t('Действует профиль «{name}».',{name:pr.name}));}
  showMenu(btn,`<div class="h">${esc(t('Почему так?'))}</div>`+lines.map(l=>`<div class="p">${esc(l)}</div>`).join(''),'why',id);
}

let dragCmd=null,dragX=0,dragY=0;

function dragStart(cmd,e){if(!host||locked||e.button!==0)return;
  if(PYW){geoStart(cmd,e);return;}
  dragCmd=cmd;dragX=e.clientX;dragY=e.clientY;e.preventDefault();}
// Windows (pywebview): у окна без рамки нет «системного» перетаскивания — страница сама шлёт
// сдвиг указателя от начала жеста: geom-start:<move|край> → geom:<dx>,<dy> → geom-end
let geo=null;
function geoStart(cmd,e){
  e.preventDefault();
  geo={sx:e.screenX,sy:e.screenY,raf:0,d:[0,0]};
  try{e.target.setPointerCapture(e.pointerId);}catch(_){}
  host.postMessage('geom-start:'+(cmd==='move'?'move':cmd.split(':')[1]));
}
document.addEventListener('pointermove',e=>{
  if(!geo)return;
  geo.d=[e.screenX-geo.sx,e.screenY-geo.sy];
  if(!geo.raf)geo.raf=requestAnimationFrame(()=>{if(geo){geo.raf=0;host.postMessage('geom:'+geo.d.join(','));}});
});
document.addEventListener('pointerup',()=>{if(geo){host.postMessage('geom:'+geo.d.join(','));host.postMessage('geom-end');geo=null;}});
const DOWN=PYW?'pointerdown':'mousedown';
document.querySelector('.bar').addEventListener(DOWN,e=>{if(!e.target.closest('.ib,a'))dragStart('move',e);});

document.addEventListener('mousemove',e=>{
  if(!dragCmd)return;
  if(!(e.buttons&1)){dragCmd=null;return;}
  if(Math.abs(e.clientX-dragX)+Math.abs(e.clientY-dragY)<3)return;
  host.postMessage(dragCmd);dragCmd=null;
});

function addMsg(m){
  if(!ensureCol(metaOf(m))){skipped.add(m.id);return false;}   // колонка скрыта или вне отбора ?only=
  msgs.set(m.id,m); return true;
}
async function initial(){
  loading=true;
  try{
    const v=await(await fetch('/api/version')).json();
    appVer=v.version; $('appName').textContent=v.name; $('ver').textContent='v'+v.version; $('ver').title=v.name+' '+v.version;
    if(v.repo) $('gh').href=v.repo;
    const p=await(await fetch('/api/prefs')).json();
    const srcs=await(await fetch('/api/sources?rules=1')).json();
    const r=await fetch('/api/messages?unread=1&rules=1&limit=300');
    const rows=await r.json();
    rulesVer=r.headers.get('X-Rules-Ver'); prefsVer=r.headers.get('X-Prefs-Ver');
    // новое состояние целиком — и только потом перерисовка (без мигания пустой доской)
    applyPrefs(p); msgs.clear(); fresh.clear(); skipped.clear(); lastId=0;
    for(const c of cols.values()) c.col.remove(); cols.clear();
    // колонки — по всем источникам из БД, даже если в них всё прочитано;
    // источник, скрытый правилами целиком, колонки не получает; закрытая колонка
    // появится сама, если в ней есть что показать
    for(const s of srcs) if(!s.hidden&&!s.closed) ensureCol(s);
    rows.forEach(m=>{addMsg(m);if(m.id>lastId)lastId=m.id;});
    renderAll(); setOnline(true);
  }catch(e){setOnline(false);updateCount();}
  loading=false;
}
async function poll(){
  if(loading) return;
  try{
    const r=await fetch('/api/messages?unread=1&rules=1&after='+lastId);
    // программу обновили и перезапустили сервер — подтягиваем новую страницу целиком
    const sv=r.headers.get('X-App-Version');
    if(appVer&&sv&&sv!==appVer){location.reload();return;}
    // правила, профиль или настройки поменяли — перечитываем доску целиком
    if(r.headers.get('X-Rules-Ver')!==rulesVer||r.headers.get('X-Prefs-Ver')!==prefsVer){await initial();return;}
    const rows=await r.json();
    if(rows.length){const keys=new Set();for(const m of rows){if(m.id>lastId)lastId=m.id;if(addMsg(m)){fresh.add(m.id);keys.add(m.src);}}renderKeys(keys);}
    setOnline(true);
  }catch(e){setOnline(false);}
}
// раз в 15 с: убрать то, что прочитано не здесь (в т.ч. само через 24 ч), и
// вернуть на доску отложенное, у которого вышло время
async function sync(){
  if(loading) return;
  try{
    const r=await(await fetch('/api/visible')).json(), want=new Set(r.ids);
    const gone=[...msgs.keys()].filter(id=>id<=r.max_id&&!want.has(id));
    const back=r.ids.filter(id=>!msgs.has(id)&&!skipped.has(id)&&id<=lastId);
    // тематические колонки: «починилось» пришло после показа — перерисовать карточку на месте
    const fixedKeys=new Set();
    for(const [id,at] of Object.entries(r.resolved||{})){const m=msgs.get(+id);if(m&&m.resolved_at!==at){m.resolved_at=at;fixedKeys.add(m.src);}}
    if(fixedKeys.size) renderKeys(fixedKeys);
    if(gone.length) dropIds(gone);
    if(back.length) await fetchBack(back);
  }catch(e){}
}

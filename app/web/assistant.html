<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>messhub — ассистент</title>
<style>
  /* окно ассистента: беседы слева, чат справа, настройки беседы — выдвижная панель; тот же язык, что настройки */
  :root {
    --bg: #171a21; --side: #12151b; --surface: rgba(255,255,255,.035); --surface2: rgba(255,255,255,.065);
    --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.14); --text: #eef1f6; --muted: #98a1b2; --faint: #6d7586;
    --accent: #6aa2ff; --accent-bg: rgba(106,162,255,.14); --ok: #43d69a; --ok-bg: rgba(67,214,154,.12);
    --warn: #f2b25a; --warn-bg: rgba(242,178,90,.1); --bad: #ff8a7a; --bad-bg: rgba(255,138,122,.12);
    --me: rgba(106,162,255,.12); --code: rgba(0,0,0,.28);
    color-scheme: dark;
  }
  body.light {
    --bg: #f6f7fa; --side: #eceef3; --surface: rgba(0,0,0,.03); --surface2: rgba(0,0,0,.06); --line: rgba(0,0,0,.09);
    --line2: rgba(0,0,0,.16); --text: #1b1f27; --muted: #5d6574; --faint: #8a91a0; --accent: #2f6fe0; --accent-bg: rgba(47,111,224,.12);
    --ok: #16935f; --ok-bg: rgba(22,147,95,.12); --warn: #b9771f; --warn-bg: rgba(185,119,31,.1); --bad: #d64545; --bad-bg: rgba(214,69,69,.1);
    --me: rgba(47,111,224,.1); --code: rgba(0,0,0,.05);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13.5px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  code, pre { font-family: ui-monospace, "DejaVu Sans Mono", Consolas, monospace; font-size: 12px; }

  .app { display: grid; grid-template-columns: 250px 1fr; height: 100%; }
  /* ── беседы ── */
  .side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side .brand { padding: 16px 16px 10px; }
  .side .brand b { display: block; font-size: 15px; }
  .side .brand span { color: var(--faint); font-size: 11.5px; }
  .side .new { margin: 0 12px 8px; }
  .side .find { margin: 0 12px 8px; }
  .sess { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .sgrp { color: var(--faint); font-size: 11px; padding: 10px 8px 4px; }
  .srow { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .srow:hover { background: var(--surface2); }
  .srow[aria-current="true"] { background: var(--accent-bg); }
  .srow .st { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow .sb { opacity: 0; display: flex; gap: 2px; }
  .srow:hover .sb, .srow:focus-within .sb { opacity: 1; }
  .side .foot { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .side .foot .note { color: var(--faint); font-size: 11px; line-height: 1.45; }

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  header[hidden] { display: none; }
  header .ttl { flex: 1; min-width: 0; font-weight: 650; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }
  header .ttl input { width: 100%; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line2); border-radius: 999px; padding: 3px 10px;
    background: var(--surface); cursor: pointer; color: var(--muted); font-size: 12px; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  .chip:hover { color: var(--text); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: 0 0 auto; }
  .chip.off .dot { background: var(--bad); }

  .btn { background: var(--surface2); border: 1px solid var(--line2); border-radius: 8px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1320; font-weight: 600; }
  .btn.ghost { background: none; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); background: var(--surface2); }
  .btn.danger { background: none; border-color: transparent; color: var(--bad); }
  .btn.danger:hover { background: var(--bad-bg); }
  .btn.confirm { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
  .btn.sm { padding: 2px 8px; font-size: 12px; }
  .btn:disabled { opacity: .45; pointer-events: none; }
  .ib { width: 26px; height: 26px; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .ib:hover { color: var(--text); background: var(--surface2); }
  .inp { background: var(--surface); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 10px; min-width: 0; }
  .inp::placeholder { color: var(--faint); }
  select.inp { cursor: pointer; }
  select.inp option { background: #1e222b; }
  body.light select.inp option { background: #fff; }

  /* ── чат ── */
  #chat { flex: 1; overflow-y: auto; padding: 18px 0 8px; }
  .col { max-width: 820px; margin: 0 auto; padding: 0 20px; }
  .msg { margin: 0 0 16px; }
  .msg.me { display: flex; justify-content: flex-end; }
  .msg.me .bub { background: var(--me); border-radius: 14px 14px 4px 14px; padding: 8px 12px; max-width: 80%; white-space: pre-wrap; word-break: break-word; }
  .msg.ai .bub { line-height: 1.6; word-break: break-word; }
  .msg.ai .bub p { margin: 0 0 8px; }
  .msg.ai .bub ul, .msg.ai .bub ol { margin: 0 0 8px; padding-left: 22px; }
  .msg.ai .bub li { margin: 2px 0; }
  .msg.ai .bub h4 { margin: 10px 0 6px; font-size: 13.5px; }
  .msg.ai .bub h3 { margin: 12px 0 6px; font-size: 15px; }
  .msg.ai .bub code { background: var(--code); border-radius: 4px; padding: 0 4px; }
  .msg.ai .bub blockquote { margin: 0 0 8px; padding: 2px 0 2px 12px; border-left: 3px solid var(--line2); color: var(--muted); }
  .msg.ai .bub blockquote p:last-child { margin-bottom: 0; }
  .msg.ai .bub hr { border: 0; border-top: 1px solid var(--line2); margin: 12px 0; }
  .msg.ai .bub li.tk { list-style: none; margin-left: -18px; }
  .msg.ai .bub .task { color: var(--muted); } .msg.ai .bub .task.done { color: var(--ok); }
  .msg.ai .bub s { color: var(--muted); }
  /* код: шапка с языком и «Скопировать», подсветка */
  .code { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 10px; background: var(--code); overflow: hidden; }
  .code .ch, .chart .chh { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 12px; border-bottom: 1px solid var(--line); color: var(--faint); font-size: 11.5px; }
  .code .sp, .chart .sp { flex: 1; }
  .cbtn { border: 0; background: none; color: var(--muted); font-size: 11.5px; padding: 2px 8px; border-radius: 6px; cursor: pointer; }
  .cbtn:hover { color: var(--text); background: var(--surface2); }
  .code pre { margin: 0; padding: 10px 12px; overflow: auto; max-height: 520px; white-space: pre; line-height: 1.5; }
  .code code { background: none !important; padding: 0 !important; }
  .t-kw { color: #c79bff; } .t-str { color: #9ad48a; } .t-num { color: #f2b25a; } .t-com { color: var(--faint); font-style: italic; }
  .t-key { color: #7fb6ff; } .t-fn { color: #6fd3e0; } .t-add { color: var(--ok); } .t-del { color: var(--bad); }
  body.light .t-kw { color: #7a3fc7; } body.light .t-str { color: #2f7d32; } body.light .t-num { color: #b5651d; }
  body.light .t-key { color: #2f5fb8; } body.light .t-fn { color: #0f7c8a; }
  /* таблицы */
  .tbl { overflow-x: auto; margin: 0 0 10px; border: 1px solid var(--line); border-radius: 10px; }
  .tbl table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .tbl th, .tbl td { padding: 5px 10px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
  .tbl thead th { border-top: 0; background: var(--surface2); font-weight: 600; white-space: nowrap; }
  .tbl td { font-variant-numeric: tabular-nums; }
  /* графики: цвета рядов — проверенная палитра (тёмная и светлая), текст — цветом текста, сетка — едва видна */
  .chart { margin: 0 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --so:#6d7586; }
  body.light .chart { --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --so:#9aa0ab; }
  .chart.wait { padding: 16px; color: var(--muted); }
  .chart .chh b { color: var(--text); font-size: 12.5px; }
  .chart .lg { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 12px 0; font-size: 12px; color: var(--muted); }
  .chart .lg span { display: inline-flex; align-items: center; gap: 6px; }
  .chart .lg b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chart .lg i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .chart .cv { padding: 6px 8px 4px; }
  .chart svg { display: block; width: 100%; height: auto; font: 11px system-ui, sans-serif; }
  .chart .ctab { margin: 8px; }
  .chart .grid { stroke: var(--line); stroke-width: 1; } .chart .axis { stroke: var(--line2); stroke-width: 1; }
  .chart .tick, .chart .lab { fill: var(--faint); font-variant-numeric: tabular-nums; }
  .chart .val { fill: var(--muted); font-variant-numeric: tabular-nums; }
  .chart .tot { fill: var(--text); font-size: 22px; font-weight: 650; }
  .chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .dot { stroke: var(--bg); stroke-width: 2; }
  .chart .slice { stroke: var(--bg); stroke-width: 2; }
  .chart .hr { fill: transparent; } .chart .hit:hover .hr { fill: var(--surface2); }
  .chart .xh { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; } .chart .hit:hover .xh { opacity: 1; }
  .chart .slice:hover { opacity: .85; }
  .f1{fill:var(--s1);background:var(--s1)} .f2{fill:var(--s2);background:var(--s2)} .f3{fill:var(--s3);background:var(--s3)} .f4{fill:var(--s4);background:var(--s4)}
  .f5{fill:var(--s5);background:var(--s5)} .f6{fill:var(--s6);background:var(--s6)} .f7{fill:var(--s7);background:var(--s7)} .f8{fill:var(--s8);background:var(--s8)}
  .fo{fill:var(--so);background:var(--so)}
  .k1{stroke:var(--s1)} .k2{stroke:var(--s2)} .k3{stroke:var(--s3)} .k4{stroke:var(--s4)} .k5{stroke:var(--s5)} .k6{stroke:var(--s6)} .k7{stroke:var(--s7)} .k8{stroke:var(--s8)}
  #ctip { position: fixed; z-index: 30; pointer-events: none; background: #262b36; color: #eef1f6; border: 1px solid var(--line2); border-radius: 8px;
    padding: 5px 9px; font-size: 12px; white-space: pre; box-shadow: 0 6px 18px rgba(0,0,0,.35); display: none; font-variant-numeric: tabular-nums; }
  /* картинки к вопросу */
  .imgs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin: 0 0 4px; }
  .imgs img { width: 120px; height: 90px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line2); cursor: zoom-in; background: var(--surface2); }
  .msg.me { flex-direction: column; align-items: flex-end; }
  .atts { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 2px; }
  .atts:empty { display: none; }
  .att { position: relative; }
  .att img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line2); display: block; }
  .att button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; border: 0; background: var(--bad); color: #fff;
    font-size: 11px; line-height: 18px; padding: 0; cursor: pointer; }
  .qwrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .box.drop { border-color: var(--accent); background: var(--accent-bg); }
  .vwarn { color: var(--warn); }
  .lb { position: fixed; inset: 0; background: rgba(0,0,0,.78); z-index: 40; display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
  .lb img { max-width: 94vw; max-height: 92vh; border-radius: 8px; }
  /* облачная модель (OpenRouter): жёлтая плашка */
  .ext { border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent); background: var(--warn-bg); color: var(--text); border-radius: 12px; padding: 10px 14px; margin: 0 0 14px; }
  .ext b.w { color: var(--warn); }
  .ext p { margin: 6px 0; color: var(--muted); font-size: 12.5px; }
  .ext .row { margin: 8px 0 0; }
  .extbar { display: flex; align-items: center; gap: 8px; border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent); background: var(--warn-bg);
    border-radius: 10px; padding: 5px 10px; margin: 0 0 8px; font-size: 12px; color: var(--muted); }
  .extbar b { color: var(--warn); font-weight: 650; }
  .chip.ext2 { border-color: color-mix(in srgb, var(--warn) 60%, transparent); color: var(--warn); }
  .chip.ext2 .dot { background: var(--warn); }
  .filt { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .filt label { display: inline-flex; gap: 5px; align-items: center; border: 1px solid var(--line2); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
  .filt label:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); color: var(--text); }
  .filt input { display: none; }
  .tag.ext { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .pcard.cloud { border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .pcard.cloud[aria-checked="true"] { border-color: var(--warn); background: var(--warn-bg); }
  .msg.ai .bub a.ref { color: var(--accent); text-decoration: none; background: var(--accent-bg); border-radius: 5px; padding: 0 4px; font-size: 12px; cursor: pointer; }
  .msg.ai .bub a.lnk { color: var(--accent); }
  .msg.ai .bub .caret { display: inline-block; width: 7px; height: 14px; background: var(--muted); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  details.thk { margin: 0 0 8px; border-left: 2px solid var(--line2); padding: 2px 0 2px 10px; color: var(--muted); }
  details.thk summary { cursor: pointer; font-size: 12px; list-style: none; user-select: none; }
  details.thk summary::-webkit-details-marker { display: none; }
  details.thk summary::before { content: '›'; display: inline-block; margin-right: 6px; transition: transform .15s; }
  details.thk[open] summary::before { transform: rotate(90deg); }
  details.thk .tt { white-space: pre-wrap; font-size: 12px; line-height: 1.5; margin-top: 4px; max-height: 320px; overflow-y: auto; }
  .note { color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 6px 10px; margin: 4px 0 0; font-size: 12.5px; }
  .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--faint); font-size: 11.5px; margin-top: 2px; }
  .meta .sp { flex: 1; }
  .srcs { margin-top: 6px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .srcs .sr { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 5px 10px; border-top: 1px solid var(--line); font-size: 12px; cursor: pointer; }
  .srcs .sr:first-child { border-top: 0; }
  .srcs .sr:hover { background: var(--surface2); }
  .srcs .sr .n { color: var(--accent); font-variant-numeric: tabular-nums; }
  .srcs .sr .x { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srcs .sr .x b { font-weight: 600; }
  .ctx { color: var(--faint); font-size: 11.5px; margin: -6px 0 10px; }
  .err { color: var(--bad); background: var(--bad-bg); border-radius: 10px; padding: 8px 12px; margin: 0 0 14px; }

  .hello { text-align: center; padding: 40px 0 10px; }
  .hello h2 { font-size: 20px; margin: 0 0 6px; }
  .hello p { color: var(--muted); margin: 0 auto 18px; max-width: 60ch; }
  .quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; text-align: left; }
  .qa { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
  .qa:hover { border-color: var(--line2); background: var(--surface2); }
  .qa b { display: block; margin-bottom: 2px; }
  .qa span { color: var(--muted); font-size: 12px; }

  .composer { flex: 0 0 auto; border-top: 1px solid var(--line); padding: 10px 0 12px; }
  .box { display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--line2); border-radius: 14px; background: var(--surface); padding: 6px 6px 6px 12px; }
  .box:focus-within { border-color: var(--accent); }
  .box textarea { flex: 1; border: 0; background: none; resize: none; outline: none; max-height: 200px; min-height: 24px; padding: 4px 0; line-height: 1.5; }
  .send { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--accent); color: #0d1320; cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; flex: 0 0 auto; }
  .send.stop { background: var(--bad); color: #fff; }
  .send:disabled { opacity: .4; cursor: default; }
  .under { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; color: var(--faint); font-size: 11.5px; }
  .under select { font-size: 11.5px; padding: 1px 6px; border-radius: 6px; }
  .under .sp { flex: 1; }

  /* ── панели: мастер, модели ── */
  .panel { flex: 1; overflow-y: auto; padding: 22px 0 40px; }
  .panel h1 { font-size: 20px; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
  .steps { display: flex; gap: 6px; margin: 0 0 18px; color: var(--faint); font-size: 12px; flex-wrap: wrap; }
  .steps span { border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
  .steps span.on { color: var(--text); border-color: var(--accent); background: var(--accent-bg); }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0 0 16px; }
  .pcard { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--surface); cursor: pointer; text-align: left; }
  .pcard:hover { border-color: var(--line2); }
  .pcard[aria-checked="true"] { border-color: var(--accent); background: var(--accent-bg); }
  .pcard h3 { margin: 0 0 4px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .pcard p { margin: 4px 0; color: var(--muted); font-size: 12.5px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .muted { color: var(--muted); } .faint { color: var(--faint); }
  .list { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: 0 0 16px; }
  .mrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); background: var(--surface); }
  .mrow:first-child { border-top: 0; }
  .mrow .nm { font-weight: 600; overflow-wrap: anywhere; }
  .mrow .sub { color: var(--muted); font-size: 12px; }
  .mrow .btns { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .tag { display: inline-block; font-size: 10.5px; border: 1px solid var(--line2); border-radius: 999px; padding: 0 7px; margin-left: 6px; color: var(--muted); vertical-align: 1px; }
  .tag.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .tag.cpu { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .tag.big { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 16px 0 12px; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 12px; cursor: pointer; color: var(--muted); margin-bottom: -1px; }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .tabs .n { color: var(--faint); font-weight: 400; margin-left: 4px; }
  .msearch { width: 100%; margin: 0 0 12px; }

<script>
// ошибки страницы — в журнал программы (настройки → «Логи»)

const $ = id => document.getElementById(id);
const QS = new URLSearchParams(location.search);
const PYW = QS.get('host') === 'pywebview', pywQueue = [];
const host = (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.widget) ||

function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}

async function api(path,body){

}
async function copyText(s){

    let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();return ok;}
}
function confirmBtn(b,ask,run){let armed=0;const orig=b.innerHTML;
  b.onclick=async e=>{e.stopPropagation();if(!b.classList.contains('confirm')){b.classList.add('confirm');b.textContent=ask;
    armed=setTimeout(()=>{b.classList.remove('confirm');b.innerHTML=orig;},4000);return;}
    clearTimeout(armed);b.classList.remove('confirm');b.innerHTML=orig;await run();};}
function openMessage(id){ if(host) host.postMessage('message:'+id); else window.open('/message?id='+id,'messhub-message','width=900,height=640'); }
const gb=x=>(Math.round(x*10)/10).toLocaleString(LANG==='en'?'en':'ru')+' '+t('ГБ');
const PERIOD_NAMES={'1d':'за сутки','2d':'за 2 дня','7d':'за неделю','30d':'за месяц','all':'за всё время'};
const FIT={ok:['ok','поместится в видеокарту'],cpu:['cpu','на процессоре — медленнее'],big:['big','может не хватить памяти']};

// ── ответ модели: безопасный Markdown — заголовки, списки (вложенные, задачи), таблицы, цитаты, код с подсветкой,
//    JSON, графики из блоков ```chart; номера #123 — ссылки на сообщения ──
function inline(s){
  return String(s).split(/(`[^`\n]+`)/).map((part,i)=>i%2?`<code>${esc(part.slice(1,-1))}</code>`:inlineText(part)).join('');
}
function inlineText(s){
  const keep=[]; const hold=h=>{keep.push(h);return `\u0000${keep.length-1}\u0000`;};
  s=esc(s);
  s=s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)"<>]+)\)/g,(m,txt,url)=>hold(`<a class="lnk" href="${url}" target="_blank" rel="noopener noreferrer">${txt}</a>`));
  s=s.replace(/https?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)]/g,m=>hold(`<a class="lnk" href="${m}" target="_blank" rel="noopener noreferrer">${m}</a>`));
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^\w])__([^_\n]+)__(?!\w)/g,'$1<b>$2</b>')
     .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g,'$1<i>$2</i>').replace(/~~([^~\n]+)~~/g,'<s>$1</s>');
  s=s.replace(/(^|[\s(\[,;:])#(\d{1,9})\b/g,'$1<a class="ref" data-ref="$2" title="'+attr(t('Открыть сообщение'))+'">#$2</a>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>keep[+i]);
}
// подсветка кода: строки, комментарии, числа, ключевые слова — простым разбором, без внешних библиотек
const HL_KW={
  js:'as async await break case catch class const continue default delete do else export extends false finally for from function if import in instanceof interface let new null of return static super switch this throw true try type typeof undefined var void while yield',
  py:'and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return self True try while with yield',
  sh:'case cd do done echo elif else esac exit export fi for function if in local return sudo then until while',
  sql:'all alter and as asc avg between by case count create delete desc distinct drop else end exists from group having in index inner insert into is join key left like limit max min not null offset on or order outer primary right select set sum table then union update values when where',
  go:'break case chan const continue default defer else fallthrough false for func go goto if import interface map nil package range return select struct switch true type var',
  rs:'as async await break const continue crate dyn else enum extern false fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait true type unsafe use where while',
  c:'auto bool break case catch char class const continue default delete do double else enum extern false float for if int long namespace new nullptr private protected public return short sizeof static struct switch template this throw true try typedef union unsigned using void volatile while',
  yaml:'true false null yes no on off', css:'important',
};
const HL_ALIAS={javascript:'js',ts:'js',typescript:'js',jsx:'js',tsx:'js',mjs:'js',python:'py',py3:'py',bash:'sh',shell:'sh',zsh:'sh',console:'sh',
  dockerfile:'sh',postgres:'sql',postgresql:'sql',mysql:'sql',sqlite:'sql',golang:'go',rust:'rs','c++':'c',cpp:'c',h:'c',java:'c',cs:'c',csharp:'c',
  kotlin:'c',php:'c',swift:'c',yml:'yaml',toml:'yaml',ini:'yaml',scss:'css',less:'css',xml:'html',svg:'html',vue:'html'};
function paint(src,re,pick){
  let out='',last=0,m;re.lastIndex=0;
  while((m=re.exec(src))){if(!m[0]){re.lastIndex++;continue;}
    out+=esc(src.slice(last,m.index));const c=pick(m);out+=c?`<span class="${c}">${esc(m[0])}</span>`:esc(m[0]);last=re.lastIndex;}
  return out+esc(src.slice(last));
}
function prettyJson(src){
  const s=src.trim();
  try{const o=JSON.parse(s);return /\n/.test(s)?s:JSON.stringify(o,null,2);}catch(e){return null;}
}
function hlJson(src){
  return paint(src,/("(?:[^"\\\n]|\\.)*")(?=\s*:)|("(?:[^"\\\n]|\\.)*")|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)/g,
    m=>m[1]?'t-key':m[2]?'t-str':m[3]?'t-kw':'t-num');
}
function hlCode(code,lang){
  lang=HL_ALIAS[lang]||lang;
  if(lang==='json') return hlJson(code);
  if(lang==='html') return paint(code,/(<!--[\s\S]*?-->)|(<\/?[\w:.-]+)|([\w:-]+)(?==)|("[^"]*"|'[^']*')|(\/?>)/g,
    m=>m[1]?'t-com':m[2]||m[5]?'t-kw':m[3]?'t-key':'t-str');
  if(lang==='diff'||lang==='patch') return code.split('\n').map(l=>{const c=/^\+/.test(l)?'t-add':/^-/.test(l)?'t-del':/^@@/.test(l)?'t-kw':'';
    return c?`<span class="${c}">${esc(l)}</span>`:esc(l);}).join('\n');
  const kw=HL_KW[lang]; if(kw===undefined) return esc(code);
  const words=new Set(kw.split(' ')), ci=lang==='sql';
  const line=lang==='py'||lang==='sh'||lang==='yaml'?'#[^\\n]*':lang==='sql'?'--[^\\n]*':'\\/\\/[^\\n]*';
  const block=/^(js|go|rs|c|css|sql)$/.test(lang)?'|\\/\\*[\\s\\S]*?\\*\\/':'';
  const key=lang==='yaml'?'|(^[ \\t-]*[\\w.\\-"\']+(?=:(?:\\s|$)))':lang==='css'?'|([\\w-]+(?=\\s*:[^:]))':'';
  const re=new RegExp(`(${line}${block})|("(?:[^"\\\\\\n]|\\\\.)*"|'(?:[^'\\\\\\n]|\\\\.)*'|\`(?:[^\`\\\\]|\\\\.)*\`)${key||'|((?!))'}|(\\b0x[\\da-fA-F]+\\b|\\b\\d[\\d_]*(?:\\.\\d+)?(?:[eE][+-]?\\d+)?\\b)|([A-Za-z_$][\\w$]*)(?=\\s*\\()|([A-Za-z_$][\\w$]*)`,'gm');
  return paint(code,re,m=>{if(m[1])return't-com';if(m[2])return't-str';if(m[3])return't-key';if(m[4])return't-num';
    const w=m[5]||m[6];return words.has(ci?w.toLowerCase():w)?'t-kw':m[5]&&lang!=='sh'&&lang!=='yaml'?'t-fn':'';});
}
function codeHtml(code,lang,open){
  lang=(lang||'').toLowerCase();
  let shown=code, ln=lang;
  if(lang==='json'||(!lang&&/^\s*[\[{]/.test(code))){const p=prettyJson(code);if(p!==null){shown=p;ln='json';}}
  return `<div class="code"><div class="ch"><span>${esc(ln||t('код'))}</span>${open?`<span class="faint">${esc(t('пишет…'))}</span>`:''}<span class="sp"></span>
    <button class="cbtn" type="button" data-ccopy="1">${esc(t('Скопировать'))}</button></div><pre><code>${hlCode(shown,ln)}</code></pre></div>`;
}
function tableHtml(rows){
  const cells=l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split(/(?<!\\)\|/).map(c=>c.trim().replace(/\\\|/g,'|'));
  const head=cells(rows[0]), al=cells(rows[1]).map(c=>/^:-+:$/.test(c)?'center':/-+:$/.test(c)?'right':'');
  const td=(tag,c,i)=>`<${tag}${al[i]?` style="text-align:${al[i]}"`:''}>${inline(c)}</${tag}>`;
  return `<div class="tbl"><table><thead><tr>${head.map((c,i)=>td('th',c,i)).join('')}</tr></thead><tbody>${rows.slice(2).map(r=>
    `<tr>${cells(r).slice(0,head.length).map((c,i)=>td('td',c,i)).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const LIST_RE=/^(\s*)([-*•+]|\d{1,4}[.)])\s+(.*)$/, TABLE_SEP=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
const BLOCK_START=/^(```|~~~|#{1,6}\s|>|\s*([-*•+]|\d{1,4}[.)])\s|\s*([-*_]\s*){3,}$)/;
function md(text,live){
  const out=[], lines=String(text||'').replace(/\r/g,'').split('\n');
  let i=0; const stack=[];
  const closeLists=(to)=>{while(stack.length>to){const l=stack.pop();out.push(`</li></${l.type}>`);}};
  while(i<lines.length){
    const ln=lines[i]; let m;
    if((m=ln.match(/^\s*(```|~~~)\s*([\w+#.-]*)/))){
      closeLists(0);const fence=m[1],lang=m[2].toLowerCase(),buf=[];i++;
      while(i<lines.length&&!lines[i].trim().startsWith(fence))buf.push(lines[i++]);
      const open=i>=lines.length;i++;
      const code=buf.join('\n');
      if(lang==='chart'){
        let spec=null;try{spec=JSON.parse(code);}catch(e){}
        out.push(spec?chartHtml(spec):open&&live?`<div class="chart wait">${esc(t('Рисую график…'))}</div>`
          :codeHtml(code,'json')+`<div class="note">${esc(t('График не нарисовался: данные не похожи на JSON.'))}</div>`);
      } else out.push(codeHtml(code,lang,open&&live));
      continue;
    }
    if((m=ln.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))){closeLists(0);out.push(m[1].length<=2?`<h3>${inline(m[2])}</h3>`:`<h4>${inline(m[2])}</h4>`);i++;continue;}
    if(/^\s*([-*_]\s*){3,}$/.test(ln)){closeLists(0);out.push('<hr>');i++;continue;}
    if(/^\s*>/.test(ln)){closeLists(0);const buf=[];while(i<lines.length&&/^\s*>/.test(lines[i]))buf.push(lines[i++].replace(/^\s*>\s?/,''));
      out.push(`<blockquote>${md(buf.join('\n'),live)}</blockquote>`);continue;}
    if(ln.includes('|')&&i+1<lines.length&&TABLE_SEP.test(lines[i+1])&&lines[i+1].includes('|')){
      closeLists(0);const rows=[ln,lines[i+1]];i+=2;while(i<lines.length&&lines[i].includes('|')&&lines[i].trim())rows.push(lines[i++]);
      out.push(tableHtml(rows));continue;}
    if((m=ln.match(LIST_RE))){
      const ind=m[1].replace(/\t/g,'    ').length, type=/\d/.test(m[2])?'ol':'ul';
      while(stack.length&&ind<stack[stack.length-1].ind-1)closeLists(stack.length-1);
      const top=stack[stack.length-1], n=parseInt(m[2],10), open=type==='ol'&&n>1?`<ol start="${n}">`:`<${type}>`;
      if(!top||ind>top.ind+1){out.push(open);stack.push({type,ind});}
      else if(top.type!==type){closeLists(stack.length-1);out.push(open);stack.push({type,ind});}
      else out.push('</li>');
      let body=m[3], task='';
      const tm=body.match(/^\[([ xX])\]\s+(.*)/); if(tm){task=`<span class="task${tm[1]===' '?'':' done'}">${tm[1]===' '?'☐':'☑'}</span> `;body=tm[2];}
      out.push(`<li${task?' class="tk"':''}>${task}${inline(body)}`);i++;
      while(i<lines.length&&lines[i].trim()&&!LIST_RE.test(lines[i])&&!BLOCK_START.test(lines[i])&&/^\s{2,}/.test(lines[i]))
        out.push('<br>'+inline(lines[i++].trim()));
      continue;
    }
    if(!ln.trim()){i++;if(stack.length&&!(i<lines.length&&(LIST_RE.test(lines[i])||/^\s{2,}\S/.test(lines[i]))))closeLists(0);continue;}
    closeLists(0);
    const para=[ln];i++;
    while(i<lines.length&&lines[i].trim()&&!BLOCK_START.test(lines[i])&&!(lines[i].includes('|')&&i+1<lines.length&&TABLE_SEP.test(lines[i+1])&&lines[i+1].includes('|')))para.push(lines[i++]);
    out.push(`<p>${para.map(inline).join('<br>')}</p>`);
  }
  closeLists(0);
  return out.join('');
}

// ── графики из ```chart: {type: bar|line|pie, title, labels, series:[{name, data}]} → SVG с подсказками и таблицей ──
function chartSpec(sp){
  if(!sp||typeof sp!=='object') return null;
  let labels=sp.labels, series=sp.series, type=String(sp.type||'bar').toLowerCase();
  if(!labels&&sp.data&&Array.isArray(sp.data.labels)){labels=sp.data.labels;series=(sp.data.datasets||[]).map(d=>({name:d.label,data:d.data}));}
  if(!labels&&Array.isArray(sp.data)&&sp.data.length&&typeof sp.data[0]==='object'){
    const rows=sp.data, lk=Object.keys(rows[0]).find(k=>typeof rows[0][k]==='string')||Object.keys(rows[0])[0];
    const vk=Object.keys(rows[0]).filter(k=>k!==lk&&rows.some(r=>!isNaN(parseFloat(r[k]))));
    labels=rows.map(r=>r[lk]);series=vk.map(k=>({name:k,data:rows.map(r=>r[k])}));}
  if(series&&!Array.isArray(series)&&typeof series==='object') series=Object.entries(series).map(([name,data])=>({name,data}));
  if(!series&&Array.isArray(sp.values)) series=[{name:sp.name||'',data:sp.values}];
  if(!Array.isArray(labels)||!Array.isArray(series)||!series.length) return null;
  const num=v=>{const n=typeof v==='number'?v:parseFloat(String(v).replace(',','.').replace(/\s/g,''));return isFinite(n)?n:null;};
  labels=labels.slice(0,60).map(x=>String(x==null?'':x));
  series=series.slice(0,8).map((s,k)=>({name:String((s&&(s.name||s.label))||(series.length>1?t('Ряд {n}',{n:k+1}):'')),
    data:labels.map((_,j)=>num(Array.isArray(s)?s[j]:s&&s.data?s.data[j]:null))}));
  if(!series.some(s=>s.data.some(v=>v!==null))) return null;
  if(!/^(bar|line|pie|donut|area)$/.test(type)) type=type.includes('pie')||type.includes('doughnut')?'pie':type.includes('line')?'line':'bar';
  return {type:type==='donut'?'pie':type==='area'?'line':type,title:String(sp.title||''),labels,series,unit:String(sp.unit||'')};
}
const fmtN=v=>v==null?'—':Number(v).toLocaleString(LANG==='en'?'en':'ru',{maximumFractionDigits:Math.abs(v)<10?2:Math.abs(v)<1000?1:0});
const fmtS=v=>Math.abs(v)>=1e6?fmtN(v/1e6)+(LANG==='en'?'M':' млн'):Math.abs(v)>=1e4?fmtN(v/1e3)+(LANG==='en'?'k':' тыс'):fmtN(v);
function niceScale(lo,hi){
  if(lo===hi){hi=lo+1;lo=Math.min(0,lo);}
  const raw=(hi-lo)/4, p=Math.pow(10,Math.floor(Math.log10(raw))), step=[1,2,2.5,5,10].map(k=>k*p).find(s=>s>=raw);
  const a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step, ticks=[];
  for(let v=a;v<=b+step/2;v+=step)ticks.push(+v.toFixed(10));
  return {lo:a,hi:b,ticks};
}
const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
function chartHtml(raw){
  const c=chartSpec(raw);
  if(!c) return `<div class="note">${esc(t('График не нарисовался: нужны labels и series с числами.'))}</div>`+codeHtml(JSON.stringify(raw,null,2),'json');
  const u=c.unit?' '+c.unit:'', multi=c.series.length>1||c.type==='pie';
  let svg='', legend='';
  const W=640, tip=s=>` data-tip="${attr(s)}"`;
  if(c.type==='pie'){
    let items=c.labels.map((l,j)=>({l,v:Math.max(0,c.series[0].data[j]||0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
    if(items.length>6){const rest=items.slice(5).reduce((a,x)=>a+x.v,0);items=items.slice(0,5).concat([{l:t('Другое'),v:rest,other:1}]);}
    const sum=items.reduce((a,x)=>a+x.v,0)||1, R=110, r0=68, cx=W/2, cy=130;
    let a0=-Math.PI/2;
    svg=`<svg viewBox="0 0 ${W} 260" role="img" aria-label="${attr(c.title||t('График'))}">`+items.map((x,k)=>{
      const a1=a0+2*Math.PI*x.v/sum, big=a1-a0>Math.PI?1:0, p=(r,a)=>`${(cx+r*Math.cos(a)).toFixed(2)},${(cy+r*Math.sin(a)).toFixed(2)}`;
      const d=items.length===1?`M${cx-R},${cy}a${R},${R} 0 1,0 ${2*R},0a${R},${R} 0 1,0 ${-2*R},0M${cx-r0},${cy}a${r0},${r0} 0 1,1 ${2*r0},0a${r0},${r0} 0 1,1 ${-2*r0},0Z`
        :`M${p(R,a0)}A${R},${R} 0 ${big},1 ${p(R,a1)}L${p(r0,a1)}A${r0},${r0} 0 ${big},0 ${p(r0,a0)}Z`;
      a0=a1;
      return `<path class="${x.other?'fo':'f'+(k+1)} slice" d="${d}"${tip(`${x.l}: ${fmtN(x.v)}${u} · ${Math.round(100*x.v/sum)}%`)}/>`;
    }).join('')+`<text class="tot" x="${cx}" y="${cy-4}" text-anchor="middle">${esc(fmtS(sum))}</text><text class="lab" x="${cx}" y="${cy+14}" text-anchor="middle">${esc(t('всего'))}${esc(u)}</text></svg>`;
    legend=items.map((x,k)=>`<span><i class="${x.other?'fo':'f'+(k+1)}"></i>${esc(x.l)} <b>${Math.round(100*x.v/sum)}%</b></span>`).join('');
  } else {
    const all=c.series.flatMap(s=>s.data).filter(v=>v!==null);
    let lo=Math.min(0,...all), hi=Math.max(0,...all);
    if(c.type==='line'&&Math.min(...all)>0&&Math.min(...all)>0.5*Math.max(...all)){lo=Math.min(...all);hi=Math.max(...all);}
    const sc=niceScale(lo,hi), n=c.labels.length;
    const horiz=c.type==='bar'&&c.series.length===1&&(n>8||c.labels.some(l=>l.length>12))&&n<=30;
    if(horiz){
      const lw=Math.min(200,8+6.6*Math.max(...c.labels.map(l=>Math.min(28,l.length)))), rh=26, H=n*rh+8, x0=lw+8, x1=W-64;
      const X=v=>x0+(x1-x0)*(v-Math.min(0,sc.lo))/((sc.hi-Math.min(0,sc.lo))||1);
      svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${attr(c.title||t('График'))}"><line class="axis" x1="${X(0)}" x2="${X(0)}" y1="2" y2="${H-4}"/>`+
        c.labels.map((l,j)=>{const v=c.series[0].data[j], y=4+j*rh;
          if(v===null) return `<text class="lab" x="${lw}" y="${y+17}" text-anchor="end">${esc(trunc(l,28))}</text>`;
          const a=X(Math.min(0,v)), b=X(Math.max(0,v)), w=Math.max(1,b-a), r=Math.min(4,w/2), h=rh-8, y0=y+4;
          const d=v>=0?`M${a},${y0}H${b-r}Q${b},${y0} ${b},${y0+r}V${y0+h-r}Q${b},${y0+h} ${b-r},${y0+h}H${a}Z`
            :`M${b},${y0}H${a+r}Q${a},${y0} ${a},${y0+r}V${y0+h-r}Q${a},${y0+h} ${a+r},${y0+h}H${b}Z`;
          return `<g class="hit"${tip(`${l}: ${fmtN(v)}${u}`)}><rect class="hr" x="0" y="${y}" width="${W}" height="${rh}"/><text class="lab" x="${lw}" y="${y+17}" text-anchor="end">${esc(trunc(l,28))}</text>
            <path class="f1" d="${d}"/><text class="val" x="${v>=0?b+6:a-6}" y="${y+17}" text-anchor="${v>=0?'start':'end'}">${esc(fmtS(v))}</text></g>`;}).join('')+`</svg>`;
    } else {
      const H=280, ml=12+7*Math.max(...sc.ticks.map(v=>fmtS(v).length)), mr=14, mt=12, mb=40, pw=W-ml-mr, ph=H-mt-mb;
      const Y=v=>mt+ph*(1-(v-sc.lo)/((sc.hi-sc.lo)||1)), band=pw/n, every=Math.ceil(n/Math.floor(pw/64));
      svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${attr(c.title||t('График'))}">`+
        sc.ticks.map(v=>`<line class="${v===0?'axis':'grid'}" x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${ml-6}" y="${Y(v)+4}" text-anchor="end">${esc(fmtS(v))}</text>`).join('')+
        c.labels.map((l,j)=>j%every?'':`<text class="lab" x="${ml+band*(j+.5)}" y="${H-mb+18}" text-anchor="middle">${esc(trunc(l,Math.max(6,Math.floor(band*every/7))))}</text>`).join('');
      const tipAt=j=>`${c.labels[j]}\n`+c.series.map(s=>`${s.name?s.name+': ':''}${fmtN(s.data[j])}${u}`).join('\n');
      if(c.type==='bar'){
        const gw=band*(c.series.length>1?.78:.62), bw=Math.max(2,gw/c.series.length-2);
        svg+=c.labels.map((l,j)=>{const gx=ml+band*j+(band-gw)/2;
          return `<g class="hit"${tip(tipAt(j))}><rect class="hr" x="${ml+band*j}" y="${mt}" width="${band}" height="${ph}"/>`+c.series.map((s,k)=>{const v=s.data[j];if(v===null)return'';
            const x=gx+k*(bw+2), yv=Y(v), y0=Y(Math.max(sc.lo,Math.min(0,sc.hi))), top=Math.min(yv,y0), h=Math.max(1,Math.abs(y0-yv)), r=Math.min(4,bw/2,h);
            const d=v>=0?`M${x},${top+h}V${top+r}Q${x},${top} ${x+r},${top}H${x+bw-r}Q${x+bw},${top} ${x+bw},${top+r}V${top+h}Z`
              :`M${x},${top}V${top+h-r}Q${x},${top+h} ${x+r},${top+h}H${x+bw-r}Q${x+bw},${top+h} ${x+bw},${top+h-r}V${top}Z`;
            return `<path class="f${k+1}" d="${d}"/>`;}).join('')+`</g>`;}).join('');
      } else {
        const X=j=>ml+band*(j+.5), dots=n<=24;
        svg+=c.series.map((s,k)=>{let d='',pen=false;s.data.forEach((v,j)=>{if(v===null){pen=false;return;}d+=(pen?'L':'M')+X(j).toFixed(1)+','+Y(v).toFixed(1);pen=true;});
          return `<path class="k${k+1} ln" d="${d}"/>`+(dots?s.data.map((v,j)=>v===null?'':`<circle class="f${k+1} dot" cx="${X(j)}" cy="${Y(v)}" r="4"/>`).join(''):'');}).join('')+
          c.labels.map((l,j)=>`<g class="hit"${tip(tipAt(j))}><rect class="hr" x="${ml+band*j}" y="${mt}" width="${band}" height="${ph}"/><line class="xh" x1="${X(j)}" x2="${X(j)}" y1="${mt}" y2="${mt+ph}"/></g>`).join('');
      }
      svg+='</svg>';
      legend=multi?c.series.map((s,k)=>`<span><i class="f${k+1}"></i>${esc(s.name)}</span>`).join(''):'';
    }
  }
  const table=`<div class="tbl ctab" hidden><table><thead><tr><th></th>${c.series.map(s=>`<th style="text-align:right">${esc(s.name||t('Значение'))}</th>`).join('')}</tr></thead><tbody>${
    c.labels.map((l,j)=>`<tr><td>${esc(l)}</td>${c.series.map(s=>`<td style="text-align:right">${esc(fmtN(s.data[j]))}${esc(u)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  return `<figure class="chart"><div class="chh">${c.title?`<b>${esc(c.title)}</b>`:''}<span class="sp"></span>

    ${legend?`<div class="lg">${legend}</div>`:''}<div class="cv">${svg}</div>${table}</figure>`;
}

function drawAtts(){
  const box=$('atts'); if(!box) return;
  box.innerHTML=ATT.map((a,i)=>`<span class="att"><img src="${attr(a.url)}" alt="" title="${attr(a.name)}"><button type="button" data-rmatt="${i}" title="${attr(t('Убрать'))}">✕</button></span>`).join('');

function shrink(file){
  return new Promise((ok,bad)=>{
    if(!/^image\/(png|jpeg|gif|webp)$/.test(file.type)) return bad(new Error(t('Годятся PNG, JPEG, GIF и WebP')));
    const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));URL.revokeObjectURL(u);
      if(k===1&&file.size<2.5*1024*1024){const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>bad(r.error);r.readAsDataURL(file);return;}
      const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.88));};
    im.onerror=()=>{URL.revokeObjectURL(u);bad(new Error(t('Картинка не открылась')));};
    im.src=u;});
}
async function addImages(files){
  for(const f of files){
    if(ATT.length>=IMG_MAX){toast(t('Не больше {n} картинок к одному вопросу',{n:IMG_MAX}),true);break;}
    try{ATT.push({name:f.name||'image',url:await shrink(f)});}catch(e){toast(e.message,true);}
  }
  drawAtts(); if($('q'))$('q').focus();
}

async function send(){
  const q=$('q'), images=ATT.map(a=>a.url);
  let text=q.value.trim();
  if((!text&&!images.length)||streaming) return;
  if(!text) text=t('Что на картинке?');
  const s=CUR.settings;
  if(!s.model){toast(t('Выбери модель в настройках беседы'),true);openDrawer();return;}
  q.value='';q.oninput();ATT=[];drawAtts();
  CUR.messages=[...(CUR.messages||[]),{role:'user',content:text,previews:images}];
  const box=$('msgs');
  if(CUR.messages.length===1) box.innerHTML='';
  box.insertAdjacentHTML('beforeend',msgHtml({role:'user',content:text,previews:images}));
  box.insertAdjacentHTML('beforeend',`<div class="ctx" id="ctxLine">${esc(t('Собираю сообщения…'))}</div>`+msgHtml({role:'assistant',content:''},true));
  const liveMsg=box.lastElementChild, live=liveMsg.querySelector('.bub');
  $('chat').scrollTop=$('chat').scrollHeight;
  const ctl=new AbortController(); streaming=ctl; setSendState();
  let acc='', thinkAcc='', err='', drawT=0;
  const redraw=()=>{
    if(thinkAcc){let d=liveMsg.querySelector('details.thk');const wasOpen=d?d.open:CUR.settings.think==='show';
      if(!d){live.insertAdjacentHTML('beforebegin',thinkHtml(thinkAcc,true));d=liveMsg.querySelector('details.thk');}
      d.open=wasOpen;d.querySelector('summary').textContent=(acc?t('Размышления модели'):t('Думает…'))+' · '+t('{n} символов',{n:thinkAcc.length.toLocaleString()});
      const tt=d.querySelector('.tt');tt.textContent=thinkAcc;if(d.open)tt.scrollTop=tt.scrollHeight;}
    live.innerHTML=md(acc,true)+'<span class="caret"></span>';bindMsgs(live);
    const c=$('chat');if(c.scrollHeight-c.scrollTop-c.clientHeight<160)c.scrollTop=c.scrollHeight;};
  try{
    const r=await fetch('/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session:CUR.id,text,images}),signal:ctl.signal});
    if(!r.ok){let d=null;try{d=await r.json();}catch(e){}throw new Error((d&&d.error)||t('Сервер ответил {c}',{c:r.status}));}
    const reader=r.body.getReader(), dec=new TextDecoder(); let buf='';
    for(;;){
      const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,nl); buf=buf.slice(nl+1);
        if(!line.trim()) continue;
        let ev; try{ev=JSON.parse(line);}catch(e){continue;}
        if(ev.type==='context') $('ctxLine').textContent=t('Выборка: {s}',{s:ev.summary});
        else if(ev.type==='token'||ev.type==='think'){if(ev.type==='think')thinkAcc+=ev.t;else acc+=ev.t;
          if(!drawT)drawT=setTimeout(()=>{drawT=0;redraw();},60);}
        else if(ev.type==='retry') $('ctxLine').textContent=ev.text;
        else if(ev.type==='error') err=ev.error;
      }
    }
  }catch(e){ if(e.name!=='AbortError') err=e.message; }
  clearTimeout(drawT); streaming=null; setSendState();
  try{CUR=await api('/api/ai/session?id='+CUR.id);}catch(e){}
  await loadSessions(); drawHead(); drawMessages();
  if(err){$('msgs').insertAdjacentHTML('beforeend',`<div class="err">${esc(err)}</div>`);$('chat').scrollTop=$('chat').scrollHeight;}
}

let pullT=0;
function pullHtml(p){
  if(!p||(!p.model)) return '';
  const pct=p.total?Math.round(100*p.completed/p.total):0;
  return `<div class="pullbox"><b>${esc(p.model)}</b> — ${esc(p.error?t('ошибка: {e}',{e:p.error}):p.done?(p.status==='success'?t('скачана'):p.status):p.status||'…')}
    ${!p.done?`<div class="prog"><i style="width:${pct}%"></i></div><div class="row"><span class="faint">${p.total?esc(gb(p.completed/1073741824)+' / '+gb(p.total/1073741824)+' · '+pct+'%'):''}</span>
      <button class="btn ghost sm" type="button" id="pullStop">${esc(t('Отменить'))}</button></div>`:''}</div>`;
}
function watchPull(after){
  clearInterval(pullT);
  pullT=setInterval(async()=>{let p;try{p=await api('/api/ai/pull');}catch(e){return;}
    const box=$('pullSlot');if(box){box.innerHTML=pullHtml(p);bindPull();}
    if(p.done){clearInterval(pullT);await loadStatus();if(after)after(p);}},1000);
}
function bindPull(){const b=$('pullStop');if(b)b.onclick=async()=>{await api('/api/ai/pull/cancel',{});toast(t('Отменяю…'));};}
// вкладки «Установленные» / «Скачать» и поиск по названию и описанию (состояние — между перерисовками)
let mTab=null, mQuery='', mPick='';
function modelLists(provider){
  if(provider==='openrouter') return {inst:ST.openrouter.models||[],cat:[]};
  const o=ST.ollama, l=ST.lmstudio;
  const inst=provider==='lmstudio'?(l.models||[]).filter(m=>!m.embed):(o.models||[]).filter(m=>!m.embed);
  const have=new Set((o.models||[]).map(m=>m.name));
  const cat=provider==='ollama'?ST.catalog.filter(c=>!have.has(c.name)&&!have.has(c.name+':latest')):[];
  return {inst,cat};
}
let orF={free:false,vision:false,reasoning:false};
function modelsHtml(pickable, provider){
  const {inst,cat}=modelLists(provider);
  if(pickable&&!mPick) mPick=PREFS.ai.provider===provider?PREFS.ai.model:'';
  if(provider==='openrouter') return `<div class="filt">${[['free','Бесплатные'],['vision','Видят картинки'],['reasoning','Размышляют']].map(([k,l])=>
      `<label><input type="checkbox" data-orf="${k}"${orF[k]?' checked':''}>${esc(t(l))}</label>`).join('')}</div>
    <input class="inp msearch" id="mSearch" value="${attr(mQuery)}" placeholder="${attr(t('Найти среди {n} моделей: gemini, qwen, deepseek…',{n:inst.length}))}">
    <div id="mBody"></div>`;
  if(mTab===null||(provider!=='ollama'&&mTab==='get')) mTab=inst.length||provider!=='ollama'?'local':'get';
  if(pickable&&!mPick) mPick=PREFS.ai.provider===provider?PREFS.ai.model:'';
  return `<div id="pullSlot">${provider==='ollama'?pullHtml(ST.pull):''}</div>
    <div class="tabs" role="tablist"><button type="button" role="tab" data-tab="local" aria-selected="${mTab==='local'}">${esc(t('Установленные'))}<span class="n">${inst.length}</span></button>
      ${provider==='ollama'?`<button type="button" role="tab" data-tab="get" aria-selected="${mTab==='get'}">${esc(t('Скачать'))}<span class="n">${cat.length}</span></button>`:''}</div>
    <input class="inp msearch" id="mSearch" value="${attr(mQuery)}" placeholder="${attr(t(mTab==='get'?'Найти в каталоге или ввести своё имя модели…':'Найти среди установленных…'))}">
    <div id="mBody"></div>`;
}
function modelsBody(pickable, provider){
  const {inst,cat}=modelLists(provider), hw=ST.hardware, cur=PREFS.ai, q=mQuery.trim().toLowerCase();
  const hit=(...xs)=>!q||xs.some(x=>String(x||'').toLowerCase().includes(q));
  if(provider==='openrouter'){
    const all=inst.filter(m=>hit(m.name,m.title)&&(!orF.free||m.free)&&(!orF.vision||m.vision)&&(!orF.reasoning||m.reasoning)), rows=all.slice(0,150);
    const def=m=>cur.provider===provider&&cur.model===m.name;
    if(!rows.length) return `<p class="lead">${esc(t(inst.length?'Ничего не нашлось — поменяй поиск или сними фильтры.':'Список моделей пуст — проверь интернет и нажми «Проверить ещё раз».'))}</p>`;
    return `<div class="list">${rows.map(m=>`<div class="mrow"><span>${pickable?`<input type="radio" name="mdl" value="${attr(m.name)}"${mPick===m.name?' checked':''}>`:def(m)?'★':'☁'}</span>
      <span><span class="nm">${esc(m.name)}</span>${def(m)?`<span class="tag ok">${esc(t('по умолчанию'))}</span>`:''}${m.free?`<span class="tag ok">${esc(t('бесплатно'))}</span>`:''}${m.vision?`<span class="tag">${esc(t('видит картинки'))}</span>`:''}${m.reasoning?`<span class="tag">${esc(t('размышляет'))}</span>`:''}<br>
        <span class="sub">${esc([m.title,orInfo(m)].filter(Boolean).join(' · '))}</span></span>
      <span class="btns">${pickable?'':`<button class="btn sm" type="button" data-def="${attr(m.name)}">${esc(t('По умолчанию'))}</button>`}</span></div>`).join('')}</div>
      ${all.length>rows.length?`<p class="faint">${esc(t('Показаны {a} из {b} — уточни поиск.',{a:rows.length,b:all.length}))}</p>`:''}
      <p class="faint">${esc(t('Цены — за 1 млн токенов, их берёт OpenRouter со счёта твоего ключа. Бесплатные модели обычно с ограничением запросов в минуту.'))}</p>`;
  }
  if(mTab==='local'){
    const rows=inst.filter(m=>hit(m.name,m.family,m.params));
    const row=m=>`<div class="mrow"><span>${pickable?`<input type="radio" name="mdl" value="${attr(m.name)}"${mPick===m.name?' checked':''}>`:(cur.provider===provider&&cur.model===m.name?'★':'')}</span>
      <span><span class="nm">${esc(m.name)}</span>${cur.provider===provider&&cur.model===m.name?`<span class="tag ok">${esc(t('по умолчанию'))}</span>`:''}<br>
        <span class="sub">${esc([m.params,m.quant&&m.quant!=='unknown'?m.quant:'',m.gb?gb(m.gb):'',m.loaded?t('загружена'):'',m.ctx?t('контекст до {n}',{n:m.ctx}):''].filter(Boolean).join(' · '))}</span></span>
      <span class="btns">${pickable?'':`<button class="btn sm" type="button" data-def="${attr(m.name)}">${esc(t('По умолчанию'))}</button>`}
        ${provider==='ollama'&&!pickable?`<button class="btn danger sm" type="button" data-rm="${attr(m.name)}">${esc(t('Удалить'))}</button>`:''}</span></div>`;
    if(rows.length) return `<div class="list">${rows.map(row).join('')}</div>`;
    if(q) return `<p class="lead">${esc(t('Среди установленных такой нет.'))}${provider==='ollama'?' '+esc(t('Посмотри во вкладке «Скачать».')):''}</p>`;
    return `<p class="lead">${esc(t(provider==='lmstudio'?'В LM Studio нет моделей для чата — скачай модель в самой программе (вкладка Discover) и нажми «Проверить ещё раз».':'Моделей для чата ещё нет — открой вкладку «Скачать».'))}</p>`;
  }
  const rows=cat.filter(c=>hit(c.name,c.about));
  // своё имя для скачивания: похоже на полное имя (qwen3:30b, hf.co/…) или в каталоге ничего не нашлось
  const custom=q&&/^[\w.\-/:@]{2,200}$/.test(mQuery.trim())&&!ST.catalog.some(c=>c.name===mQuery.trim())&&
    (/[:/]/.test(q)||!rows.length);
  return `<p class="lead">${esc(t('Видеопамять: {v}, оперативная: {r}. Размеры — примерно. Модель скачивается один раз и дальше работает без интернета.',{v:hw.vram_gb?gb(hw.vram_gb):t('нет NVIDIA'),r:gb(hw.ram_gb)}))}</p>
    ${custom?`<div class="list"><div class="mrow"><span>⬇</span><span><span class="nm">${esc(mQuery.trim())}</span><br><span class="sub">${esc(t('своё имя: из ollama.com/library (qwen3:30b) или с Hugging Face (hf.co/автор/модель:Q4_K_M)'))}</span></span>
      <span class="btns"><button class="btn sm primary" type="button" data-pull="${attr(mQuery.trim())}">${esc(t('Скачать'))}</button></span></div></div>`:''}
    ${rows.length?`<div class="list">${rows.map(c=>`<div class="mrow"><span>${c.ru?'🇷🇺':''}</span>
      <span><span class="nm">${esc(c.name)}</span><span class="tag ${FIT[c.fit][0]}">${esc(t(FIT[c.fit][1]))}</span><br><span class="sub">${esc(gb(c.gb))} · ${esc(c.about)}</span></span>
      <span class="btns"><button class="btn sm" type="button" data-pull="${attr(c.name)}">${esc(t('Скачать'))}</button></span></div>`).join('')}</div>`
      :custom?'':`<p class="lead">${esc(t(q?'В каталоге такой нет — впиши точное имя модели, и появится кнопка «Скачать».':'Всё из каталога уже установлено.'))}</p>`}
    <p class="faint">${esc(t('Полный список моделей — на ollama.com/library; любое имя оттуда можно вписать в поиск.'))}</p>`;
}
function bindModels(provider, onChange, pickable){
  const v=$('view');
  const body=()=>{
    $('mBody').innerHTML=modelsBody(pickable,provider);
    $('mBody').querySelectorAll('[data-pull]').forEach(b=>b.onclick=()=>startPull(b.dataset.pull,onChange));
    $('mBody').querySelectorAll('input[name=mdl]').forEach(r=>r.onchange=()=>{mPick=r.value;});
    $('mBody').querySelectorAll('[data-rm]').forEach(b=>confirmBtn(b,t('Точно удалить?'),async()=>{
      try{await api('/api/ai/delete-model',{model:b.dataset.rm});toast(t('Модель удалена'));await loadStatus();onChange();}catch(e){toast(e.message,true);}}));
    $('mBody').querySelectorAll('[data-def]').forEach(b=>b.onclick=async()=>{try{PREFS.ai=(await api('/api/ai/setup',{ai:{provider,model:b.dataset.def}})).prefs;ST.prefs=PREFS.ai;
      toast(t('Модель по умолчанию: {m}',{m:b.dataset.def}));onChange();}catch(e){toast(e.message,true);}});
  };
  v.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{mTab=b.dataset.tab;onChange();});
  v.querySelectorAll('[data-orf]').forEach(cb=>cb.onchange=()=>{orF[cb.dataset.orf]=cb.checked;body();});
  const si=$('mSearch'); si.oninput=()=>{mQuery=si.value;body();};
  body();
  bindPull(); if(ST.pull&&!ST.pull.done) watchPull(onChange);
}
async function startPull(name,onChange){
  if(!name) return;
  try{const p=await api('/api/ai/pull',{model:name});$('pullSlot').innerHTML=pullHtml(p);bindPull();watchPull(p2=>{
    toast(p2.error?t('Не скачалось: {e}',{e:p2.error}):p2.status==='success'?t('Модель {m} скачана',{m:p2.model}):t('Скачивание остановлено'),!!p2.error);onChange();});}
  catch(e){toast(e.message,true);}
}

    let body='';
    if(step===1) body=`<h1>${esc(t('Привет! Это ассистент по твоим сообщениям'))}</h1>
      <p class="lead">${esc(t('Можно спросить своими словами: «что я пропустил за утро?», «кто спрашивал про отчёт?», «что падало на серверах за неделю?», «сделай сводку по чату…». Ассистент соберёт подходящие сообщения из базы и ответит, а номера #123 в ответе откроют сами сообщения.'))}</p>
      <p class="lead">🔒 ${esc(t('Отвечает модель на этом компьютере — через Ollama или LM Studio. Сообщения никуда не уходят, интернет нужен только чтобы один раз скачать модель.'))}</p>
      <button class="btn primary" type="button" id="next">${esc(t('Начать настройку'))}</button>`;
    else if(step===2) body=`<h1>${esc(t('Где будет работать модель'))}</h1>
      <p class="lead">${esc(t('Ollama и LM Studio бесплатные и работают на этом компьютере. Если ни одной нет — проще начать с Ollama: модели скачиваются прямо отсюда. OpenRouter — облачные модели, по желанию.'))}</p>
      <div class="cards">${['ollama','lmstudio'].map(p=>{const s=p==='ollama'?ST.ollama:ST.lmstudio;const n=(s.models||[]).filter(m=>!m.embed).length;
        return `<button class="pcard" type="button" role="radio" aria-checked="${prov===p}" data-p="${p}"><h3>${esc(provName(p))} ${s.ok?`<span class="ok">✓</span>`:`<span class="bad">·</span>`}</h3>
          <p>${esc(p==='ollama'?t('Простая, модели скачиваются одной кнопкой прямо в этом окне.'):t('Программа с окном: модели ищутся и скачиваются в ней самой.'))}</p>
          <p class="${s.ok?'ok':'bad'}">${esc(s.ok?t('найдена · моделей для чата: {n}',{n}):t('не отвечает — {e}',{e:s.error}))}</p></button>`;}).join('')}
        <button class="pcard cloud" type="button" role="radio" aria-checked="${prov==='openrouter'}" data-p="openrouter"><h3>☁ OpenRouter <span class="tag ext">${esc(t('облако'))}</span></h3>
          <p>${esc(t('Сотни облачных моделей по твоему ключу, часть бесплатно. Сообщения уходят наружу — на твой страх и риск.'))}</p>
          <p class="${orOn()?'ok':'muted'}">${esc(orOn()?t('подключён · моделей: {n}',{n:(ST.openrouter.models||[]).length}):t('не подключён'))}</p></button></div>
      ${provHint(prov)}
      <div class="row"><button class="btn ghost" type="button" id="prev">${esc(t('← Назад'))}</button><button class="btn primary" type="button" id="next"${provOk(prov)?'':' disabled'}>${esc(t('Дальше'))}</button></div>`;
    else if(step===3) body=`<h1>${esc(t('Какая модель'))}</h1>
      <p class="lead">${esc(t('Выбери установленную модель или скачай новую. Для сводок и поиска по русским сообщениям хороши модели с флажком 🇷🇺.'))}</p>
      ${modelsHtml(true,prov)}
      <div class="row"><button class="btn ghost" type="button" id="prev">${esc(t('← Назад'))}</button><button class="btn primary" type="button" id="next">${esc(t('Дальше'))}</button></div>`;
    else body=`<h1>${esc(t('Готово'))}</h1>
      <p class="lead">${esc(t('Модель: {m} ({p}). Её и другие настройки — температуру, размер контекста, какие сообщения брать — можно поменять в любой беседе кнопкой настроек вверху.',{m:pick,p:provName(prov)}))}</p>
      <button class="btn primary" type="button" id="finish">${esc(t('Начать беседу'))}</button>`;
    $('view').innerHTML=`<div class="panel"><div class="col">${steps()}${body}</div></div>`;
    if($('prev'))$('prev').onclick=()=>{step--;draw();};
    if($('next'))$('next').onclick=()=>{
      if(step===3){if(!mPick){toast(t('Выбери установленную модель (или скачай и выбери)'),true);return;}pick=mPick;}
      step++;draw();};
    $('view').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{prov=b.dataset.p;mTab=null;mQuery='';mPick='';draw();});
    bindProvHint(draw);
    if(step===3) bindModels(prov,async()=>{await loadStatus();draw();},true);
    if($('finish'))$('finish').onclick=async()=>{
      try{PREFS.ai=(await api('/api/ai/setup',{ai:{provider:prov,model:pick,setup_done:true}})).prefs;
        CUR=await api('/api/ai/session',{settings:{provider:prov,model:pick}});await loadSessions();showChat();}
      catch(e){toast(e.message,true);}};
  };
  draw();
}
$('setupBtn').onclick=()=>showSetup(1);

// ── старт ──
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('drawer').classList.contains('open'))closeDrawer();});
(async()=>{
  try{
    const p=await api('/api/prefs'); setLang(p._lang); translateDom();
    document.body.classList.toggle('light',p.theme==='light');
    document.title=t('Ассистент')+' — messhub';
    try{SOURCES=await api('/api/sources');}catch(e){}
    await loadStatus(); PREFS={ai:ST.prefs};
    await loadSessions();
    if(!ST.prefs.setup_done) return showSetup(1);
    if(SESS.length) await openSession(SESS[0].id); else await newSession();
  }catch(e){
    $('view').innerHTML=`<div class="panel"><div class="col"><p class="err">${esc(t('Сервер виджета не отвечает — ассистент не загрузился.'))} ${esc(e.message)}</p></div></div>`;
  }
})();
</script>
</body>
</html>

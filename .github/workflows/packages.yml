name: packages
# Сборка и проверка пакетов. По тегу vX.Y.Z - ещё и выпуск на GitHub с этими файлами.
#   Linux:   .deb, .rpm, .tar.gz - ставятся на чистый Ubuntu, проверяется команда и сервер
#   Windows: messhub.exe → portable zip, установщик .bat, .msi - ставятся, запускаются, удаляются
#   macOS:   messhub.app (Apple Silicon, подпись ad-hoc) → .dmg, .zip - проверка подписи, образа и запуска
on:
  push:
    tags: ["v*"]
    branches: [main, contrib]
    paths:
      - "app/win*.py"
      - "app/messhub_win.py"
      - "app/mac*.py"
      - "app/messhub_mac.py"
      - "packaging/**"
      - "tools/build*.py"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # номер версии = число коммитов
      - name: Номер версии совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(python3 app/version.py)" = "${GITHUB_REF_NAME}" || { echo "тег ${GITHUB_REF_NAME}, а коммит - v$(python3 app/version.py)"; exit 1; }
      - name: Инструменты сборки
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - name: Сборка .deb, .rpm, .tar.gz
        run: python3 tools/build.py linux
      - name: Установка .deb на чистый Ubuntu и проверка
        run: |
          sudo apt-get install -y -qq ./dist/messhub_*_all.deb
          test "$(messhub --version)" = "$(python3 app/version.py)"
          python3 -c 'import gi; gi.require_version("WebKit2", "4.1"); from gi.repository import WebKit2'
          python3 /usr/lib/messhub/serve.py --db /tmp/t.db --port 8799 & sleep 3
          curl -fsS http://127.0.0.1:8799/api/version
          for p in / /widget /settings "/message?id=1" /assistant /i18n.js; do curl -fsS -o /dev/null "http://127.0.0.1:8799$p" || { echo "нет страницы $p"; exit 1; }; done
          # чужое имя сайта в Host (DNS rebinding) сервер не пускает
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example:8799' http://127.0.0.1:8799/api/version)" = 403
          # messhub run: команда выполняется, код выхода сохраняется
          set +e; MESSHUB_PORT=8799 messhub run -- sh -c 'echo hi; exit 4'; code=$?; set -e
          test "$code" = 4 || { echo "messhub run вернул $code"; exit 1; }
          sudo apt-get remove -y -qq messhub && test ! -e /usr/lib/messhub/serve.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/messhub*

  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости (pywebview, winrt, PyInstaller, WiX)
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/windows/requirements.txt pyinstaller
          dotnet tool install --global wix --version 5.0.2
      - name: Тесты
        run: python -m unittest discover -s tests -t tests -v
      - name: Сборка exe, zip, bat, msi
        run: python tools/build.py windows
      - name: Проверка сборки (без окна)
        run: |
          $env:MESSHUB_HOME = "$env:RUNNER_TEMP\mh-selftest"
          $p = Start-Process dist\win\messhub\messhub.exe -ArgumentList "--selftest","--out","$env:RUNNER_TEMP\selftest.json" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\selftest.json"
          if ($p.ExitCode -ne 0) { exit 1 }
          Get-Content "$env:MESSHUB_HOME\share\logs\collect.log" -ErrorAction SilentlyContinue
      - name: "Обёртка messhub-run.exe: код выхода команды сохраняется"
        run: |
          $env:MESSHUB_PORT = "9"
          & dist\win\messhub\messhub-run.exe -- cmd /c "echo hello & exit 3"
          if ($LASTEXITCODE -ne 3) { "код выхода $LASTEXITCODE, а должен быть 3"; exit 1 }
          exit 0
      - name: Установка .msi, запуск, удаление
        run: |
          $msi = (Get-ChildItem dist\*.msi).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\msi.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 60; exit 1 }
          $exe = "$env:LOCALAPPDATA\Programs\messhub\messhub.exe"
          if (!(Test-Path $exe)) { "нет $exe"; exit 1 }
          Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -Name messhub
          $env:MESSHUB_HOME = "$env:RUNNER_TEMP\mh-msi"
          $t = Start-Process $exe -ArgumentList "--selftest","--out","$env:RUNNER_TEMP\msi-selftest.json" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\msi-selftest.json"
          if ($t.ExitCode -ne 0) { exit 1 }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if (Test-Path $exe) { "не удалился"; exit 1 }
      - name: Установка через .bat, удаление
        run: |
          $dir = "$env:RUNNER_TEMP\bat"; New-Item -ItemType Directory $dir | Out-Null
          Copy-Item dist\*-windows-setup.bat, dist\*-windows-portable.zip $dir
          $bat = (Get-ChildItem "$dir\*.bat").FullName
          cmd /c "`"$bat`" /quiet"
          $exe = "$env:LOCALAPPDATA\Programs\messhub\messhub.exe"
          if (!(Test-Path $exe)) { "bat не поставил"; exit 1 }
          if (Test-Path "$env:LOCALAPPDATA\Programs\messhub\portable.txt") { "в установленной копии остался portable.txt"; exit 1 }
          cmd /c "`"$bat`" /uninstall"
          if (Test-Path $exe) { "bat не удалил"; exit 1 }
      - name: Чтение уведомлений Windows (проверка по возможности)
        continue-on-error: true
        shell: powershell       # Windows PowerShell 5.1: в нём есть типы WinRT для тестового уведомления
        run: |
          $exe = (Resolve-Path dist\win\messhub\messhub.exe).Path
          # согласие на доступ к уведомлениям: общее (HKLM и HKCU) и для программы без пакета - так его хранит Windows
          $cs = "Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\userNotificationListener"
          foreach ($k in @("HKLM:\$cs", "HKCU:\$cs", ("HKCU:\$cs\NonPackaged\" + ($exe -replace '\\','#')))) {
            New-Item -Path $k -Force | Out-Null
            Set-ItemProperty -Path $k -Name Value -Value Allow
          }
          $env:MESSHUB_HOME = "$env:RUNNER_TEMP\mh-capture"
          $marker = "messhub-ci-" + (Get-Random)
          $p = Start-Process $exe -ArgumentList "--capture-test",$marker,"--out","$env:RUNNER_TEMP\capture.json" -PassThru
          Start-Sleep -Seconds 6
          [Windows.UI.Notifications.ToastNotificationManager, Windows.UI.Notifications, ContentType = WindowsRuntime] | Out-Null
          [Windows.Data.Xml.Dom.XmlDocument, Windows.Data.Xml.Dom.XmlDocument, ContentType = WindowsRuntime] | Out-Null
          # как у Chrome: заголовок, текст и сайт внизу (placement="attribution" - его Windows другим программам
          # не отдаёт, проверено: сайт у Chrome на Windows не узнать)
          $xml = New-Object Windows.Data.Xml.Dom.XmlDocument
          $xml.LoadXml("<toast><visual><binding template=`"ToastGeneric`"><text>messhub CI</text><text>$marker</text><text placement=`"attribution`">web.example.org</text></binding></visual></toast>")
          $aumid = "{1AC14E77-02E7-4E5D-B744-2EB1AE5198B7}\WindowsPowerShell\v1.0\powershell.exe"
          [Windows.UI.Notifications.ToastNotificationManager]::CreateToastNotifier($aumid).Show([Windows.UI.Notifications.ToastNotification]::new($xml))
          $p.WaitForExit(60000) | Out-Null
          Get-Content "$env:RUNNER_TEMP\capture.json" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { "notification not captured (CI server may deny notification access)"; exit 1 }
      - name: Прозрачность доски и щелчок по ней (снимки для проверки)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class Mouse { [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, UIntPtr e);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r); }
          "@
          function Shot($path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path)
          }
          New-Item -ItemType Directory dist\ci -Force | Out-Null
          $env:MESSHUB_HOME = "$env:RUNNER_TEMP\mh-board"
          python tools/demo_data.py --home $env:MESSHUB_HOME --lang ru
          $p = Start-Process dist\win\messhub\messhub.exe -PassThru
          Start-Sleep -Seconds 20
          Shot "dist\ci\board-opacity.png"
          # щелчок по «глазу» в середине шапки (окно полупрозрачное, клики должны доходить): доска размывается
          $h = (Get-Process -Id $p.Id).MainWindowHandle
          $r = New-Object Mouse+RECT; [Mouse]::GetWindowRect($h, [ref]$r) | Out-Null
          "окно доски: $($r.Left),$($r.Top) - $($r.Right),$($r.Bottom)"
          [Mouse]::SetCursorPos([int](($r.Left + $r.Right) / 2) - 28, $r.Top + 19) | Out-Null; Start-Sleep -Milliseconds 400
          [Mouse]::mouse_event(2, 0, 0, 0, [UIntPtr]::Zero); Start-Sleep -Milliseconds 80
          [Mouse]::mouse_event(4, 0, 0, 0, [UIntPtr]::Zero)
          Start-Sleep -Seconds 4
          Shot "dist\ci\board-after-eye-click.png"
          Stop-Process -Id $p.Id -Force; Start-Sleep -Seconds 2
      - name: Лента важного над доской (снимок для проверки)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path)
          }
          New-Item -ItemType Directory dist\ci\strip-logs -Force | Out-Null
          $env:MESSHUB_HOME = "$env:RUNNER_TEMP\mh-strip"
          python tools/demo_data.py --home $env:MESSHUB_HOME --lang ru
          $p = Start-Process dist\win\messhub\messhub.exe -PassThru
          Start-Sleep -Seconds 20
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8765/api/prefs -ContentType "application/json" -Body '{"strip":{"on":true}}' | Out-Null
          Start-Sleep -Seconds 8
          Shot "dist\ci\board-strip.png"
          Stop-Process -Id $p.Id -Force; Start-Sleep -Seconds 2
          Copy-Item "$env:MESSHUB_HOME\share\logs\*.log" dist\ci\strip-logs\ -ErrorAction SilentlyContinue
      - name: Снимок экрана - доска и настройки на демо-данных
        continue-on-error: true
        run: |
          $env:MESSHUB_HOME = "$env:RUNNER_TEMP\mh-demo"
          python tools/demo_data.py --home $env:MESSHUB_HOME --lang ru
          $p = Start-Process dist\win\messhub\messhub.exe -ArgumentList "--settings" -PassThru
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory dist\ci -Force | Out-Null
          $bmp.Save("dist\ci\screen-ru.png")
          "screen: $($b.Width)x$($b.Height)"
          Stop-Process -Id $p.Id -Force
          Copy-Item "$env:MESSHUB_HOME\share\logs\*.log" dist\ci\ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ci-check
          path: dist/ci
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.bat
            dist/*.msi

  mac:
    runs-on: macos-15            # Apple Silicon (arm64)
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости (pywebview, PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/macos/requirements.txt pyinstaller
      - name: Тесты - сбор на поддельной базе Центра уведомлений и API
        run: |
          python -m unittest discover -s tests -t tests -p "test_maccatcher.py" -v
          python -m unittest discover -s tests -t tests -p "test_api.py" -v
      - name: Все тесты (для сведения)
        continue-on-error: true
        timeout-minutes: 5
        run: python -m unittest discover -s tests -t tests
      - name: Сборка .app, .dmg, .zip
        run: python tools/build.py mac
      - name: Проверка сборки (без окна), подписи и номера версии
        run: |
          export MESSHUB_HOME="$RUNNER_TEMP/mh-selftest"
          app=dist/mac/messhub.app
          set +e; "$app/Contents/MacOS/messhub" --selftest --out "$RUNNER_TEMP/selftest.json"; code=$?; set -e
          cat "$RUNNER_TEMP/selftest.json"
          test "$code" = 0
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier|Format"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$(python3 app/version.py)"
          lipo -archs "$app/Contents/MacOS/messhub"
      - name: "Обёртка messhub-run: код выхода команды сохраняется"
        run: |
          set +e; MESSHUB_PORT=9 dist/mac/messhub.app/Contents/MacOS/messhub-run -- sh -c 'echo hello; exit 3'; code=$?; set -e
          test "$code" = 3 || { echo "код выхода $code, а должен быть 3"; exit 1; }
      - name: Образ .dmg открывается, внутри - подписанная программа
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          ls -la "$RUNNER_TEMP/dmg"
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/messhub.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - name: Gatekeeper (для сведения - без платной подписи Apple ожидаемо «rejected»)
        continue-on-error: true
        run: spctl --assess --type execute --verbose dist/mac/messhub.app || true
      - name: Чтение уведомлений macOS (проверка по возможности)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          export MESSHUB_HOME="$RUNNER_TEMP/mh-capture"
          nc="$HOME/Library/Group Containers/group.com.apple.usernoted/db2/db"
          count() { sqlite3 -readonly "$nc" "select count(*), max(rec_id) from record" 2>&1 || true; }
          echo "база уведомлений до: $(count)"
          marker="messhub-ci-$RANDOM"
          dist/mac/messhub.app/Contents/MacOS/messhub --capture-test "$marker" --out "$RUNNER_TEMP/capture.json" &
          pid=$!
          sleep 8
          osascript -e "display notification \"$marker\" with title \"messhub CI\"" && echo "osascript: ok"
          sleep 3
          echo "база уведомлений после: $(count)"
          sqlite3 -readonly "$nc" "select r.rec_id, a.identifier, length(r.data) from record r join app a using(app_id) order by r.rec_id desc limit 3" 2>&1 || true
          mkdir -p dist/ci && screencapture -x dist/ci/after-notification.png || true
          set +e; wait $pid; code=$?; set -e
          cat "$RUNNER_TEMP/capture.json" || true
          test "$code" = 0 || { echo "notification not captured (the CI Mac may deny Full Disk Access)"; exit 1; }
      - name: Лента важного над доской (снимок для проверки)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          export MESSHUB_HOME="$RUNNER_TEMP/mh-strip"
          python tools/demo_data.py --home "$MESSHUB_HOME" --lang ru
          dist/mac/messhub.app/Contents/MacOS/messhub &
          pid=$!
          sleep 20
          curl -s -X POST http://127.0.0.1:8765/api/prefs -H 'Content-Type: application/json' -d '{"strip":{"on":true}}' >/dev/null || true
          sleep 8
          mkdir -p dist/ci/strip-logs
          screencapture -x dist/ci/board-strip.png
          python -c "import Quartz; ws=Quartz.CGWindowListCopyWindowInfo(Quartz.kCGWindowListOptionOnScreenOnly, 0); [print('окно', w.get('kCGWindowName'), dict(w.get('kCGWindowBounds', {})), 'alpha', w.get('kCGWindowAlpha')) for w in ws if w.get('kCGWindowOwnerName') == 'messhub']" || true
          kill $pid || true; sleep 2
          cp "$MESSHUB_HOME"/share/logs/*.log dist/ci/strip-logs/ 2>/dev/null || true
      - name: Снимок экрана - доска и настройки на демо-данных
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # сначала - программа с настройками по умолчанию (как у человека после установки)
          export MESSHUB_HOME="$RUNNER_TEMP/mh-fresh"
          dist/mac/messhub.app/Contents/MacOS/messhub &
          pid=$!
          sleep 20
          mkdir -p dist/ci
          screencapture -x dist/ci/fresh.png
          python -c "import Quartz; ws=Quartz.CGWindowListCopyWindowInfo(Quartz.kCGWindowListOptionOnScreenOnly, 0); [print('окно', w.get('kCGWindowName'), dict(w.get('kCGWindowBounds', {})), 'alpha', w.get('kCGWindowAlpha')) for w in ws if w.get('kCGWindowOwnerName') == 'messhub']" || true
          kill $pid || true; sleep 2
          export MESSHUB_HOME="$RUNNER_TEMP/mh-demo"
          python tools/demo_data.py --home "$MESSHUB_HOME" --lang ru
          dist/mac/messhub.app/Contents/MacOS/messhub --settings &
          pid=$!
          sleep 25
          screencapture -x dist/ci/screen-ru.png
          # окно доски отдельно, с прозрачностью (-o: без тени): видно, прозрачна ли подложка
          python -c "import Quartz; ws=Quartz.CGWindowListCopyWindowInfo(Quartz.kCGWindowListOptionOnScreenOnly, 0); [print('окно', w.get('kCGWindowName'), dict(w.get('kCGWindowBounds', {})), 'alpha', w.get('kCGWindowAlpha')) for w in ws if w.get('kCGWindowOwnerName') == 'messhub']" || true
          kill $pid || true
          cp "$MESSHUB_HOME"/share/logs/*.log dist/ci/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: mac-ci-check
          path: dist/ci
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*-macos-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4      # только пакеты; проверочный артефакт windows-ci-check в выпуск не идёт
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: dist
      - name: Заметки к выпуску - раздел этой версии из CHANGELOG.md
        env:
          REPO: ${{ github.repository }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          python3 - "$V" > notes.md <<'EOF'
          import re, sys
          v = sys.argv[1]
          s = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"## \[" + re.escape(v) + r"\].*?\n(.*?)(?=\n## )", s, re.S)
          print(m.group(1).strip() if m else f"messhub {v}")
          import os
          print(f"\n---\nУстановка / Install: https://github.com/{os.environ['REPO']}#readme")
          EOF
          (cd dist && sha256sum messhub* > SHA256SUMS.txt)
      - name: Выпуск на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "messhub ${GITHUB_REF_NAME#v}" --notes-file notes.md dist/*
          fi

# Проверки кода (ruff) — только для разработки и CI, программа по-прежнему работает
# на голой стандартной библиотеке Python (см. CONTRIBUTING.md, «Правила игры»).
#
# Правила выбраны так, чтобы ловить настоящие ошибки, а не переписывать код:
#   E9   - синтаксис
#   F    - неиспользуемые импорты и переменные, необъявленные имена (pyflakes)
#   E7   - сравнения и логика (присваивание вместо == и т. п.)
#   B    - bugbear: потерянное «raise … from», неиспользуемая переменная цикла и др.
#   BLE  - «except Exception»: в фоновых потоках это осознанное решение, каждое
#          такое место помечено noqa с объяснением, что именно там не должно падать
#   S606 - запуск процесса без оболочки: единственное место, где это написано в коде
#   RUF100 - устаревшее noqa (правило выключили, а пометка осталась)
[tool.ruff]
line-length = 120
target-version = "py39"           # поддерживается Python 3.9 и новее
extend-exclude = ["__pycache__", "dist", "packaging"]

[tool.ruff.lint]
select = ["E9", "F", "E7", "E4", "B", "BLE", "S606", "RUF100", "E731"]
ignore = [
    "E702",     # «где.append(...); params.append(...)» - плотный стиль проекта, не ошибка
]
# E402 (импорт не в начале файла) оставлен включённым: он помечен прямо в коде — там, где
# путь к программе или версия gi задаются перед импортом (tools/build.py, tests/common.py,
# app/widget.py). Список правил в i18n_check.py и CONTRIBUTING.md этому соответствует.
